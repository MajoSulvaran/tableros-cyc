<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iniciativas de Congruencia · NUBE</title>
<script src="../comun/tableros.js"></script>
<script src="../comun/puente.js" data-app="seg-congruencia"></script>
</head>
<body style="font-family:Outfit,'Segoe UI',sans-serif;color:#565b85;padding:48px;text-align:center">
<p>Cargando Iniciativas de Congruencia…</p>
<script>
/* El reporte (con sus datos) vive en el repositorio privado: reporte-soluciones/reporte.html.
   Esta página solo lo trae con la sesión de NUBE y lo muestra. */
(async function () {
  try {
    const html = await PUENTE.G.texto(TABLEROS.CFG.REPO_DATOS, 'seguridad/congruencia.html');
    if (!html) { document.body.innerHTML = '<h2 style="color:#1414B8;margin-top:12vh">Indicadores de congruencia</h2><p>Este apartado está en construcción. Cuando esté listo, se sube desde NUBE con <b>⇪ Nueva versión</b> en el menú.</p>'; return; }
    // Lo que el tablero guarda "en este navegador" se comparte con todo el equipo (repositorio privado)
    const MEM = { clave: 'congruencia_construccion_v2', ruta: 'seguridad/congruencia_v2_datos.json' };
    let datos = null; try { datos = await PUENTE.G.json(TABLEROS.CFG.REPO_DATOS, MEM.ruta); } catch (e) { /* sin acción */ }
    const gi = Storage.prototype.getItem, si = Storage.prototype.setItem;
    Storage.prototype.getItem = function (k) {
      if (this === window.localStorage && k === MEM.clave && datos) { const loc = JSON.parse(gi.call(this, k) || '{}'); return JSON.stringify(Object.assign({}, loc, datos)); }
      return gi.call(this, k);
    };
    let t = null;
    Storage.prototype.setItem = function (k, v) {
      si.call(this, k, v);
      if (this === window.localStorage && k === MEM.clave && PUENTE.rol === 'editar') {
        clearTimeout(t); t = setTimeout(() => PUENTE.G.actualizarJSON(TABLEROS.CFG.REPO_DATOS, MEM.ruta, act => Object.assign({}, act || {}, JSON.parse(v)),
          `${(PUENTE.persona || '').split(' ').slice(0, 2).join(' ')}: cargó información de ${'Indicadores de congruencia'}`).then(d => { datos = d; }).catch(e => console.warn(e)), 1500);
      }
    };
    document.open(); document.write(html); document.close();
    PUENTE.despues();
  } catch (e) { document.body.innerHTML = '<h2 style="color:#0003aa">No se pudo cargar el reporte</h2><p>' + String(e.message).replace(/</g, '&lt;') + '</p>'; }
})();
</script>
</body>
</html>
