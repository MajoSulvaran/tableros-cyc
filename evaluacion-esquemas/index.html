/* Gráfica de dispersión principal */
function drawScatter(){
  const host = $("#scatHost"); if(!host) return;
  const agg = aggregate();
  const W_=host.clientWidth, H_=Math.max(260, host.clientHeight);
  const pl=46, pr=14, pt=10, pb=38;
  const vals = S.cfg.order.flatMap(id=>[agg[id].cc,agg[id].cx,agg[id].pcc,agg[id].pcx]);
  const lo = Math.max(0, Math.min(40, Math.floor((Math.min(...vals)-4)/10)*10)), hi = Math.min(100, Math.max(90, Math.ceil((Math.max(...vals)+4)/10)*10));
  const ticks = []; for(let v=lo; v<=hi; v+=10) ticks.push(v);
  const X=v=>pl+(Math.max(lo,Math.min(hi,v))-lo)/(hi-lo)*(W_-pl-pr), Y=v=>pt+(1-(Math.max(lo,Math.min(hi,v))-lo)/(hi-lo))*(H_-pt-pb);
  const ghost = S.ghost!==false && (submitted().length>0 || !!S.simW);
  const R = Math.max(12, Math.min(16, W_/48));
  // separar burbujas empalmadas
  const pts = S.cfg.order.map(id=>({id, r:agg[id], x:X(agg[id].cc), y:Y(agg[id].cx)}));
  for(let it=0; it<40; it++) for(let i=0;i<pts.length;i++) for(let j=i+1;j<pts.length;j++){
    const a=pts[i], b=pts[j], dx=b.x-a.x, dy=b.y-a.y, d=Math.hypot(dx,dy)||.01, m=R*2+2;
    if(d<m){ const k=(m-d)/2, ux=dx/d||1, uy=dy/d; a.x-=ux*k; a.y-=uy*k; b.x+=ux*k; b.y+=uy*k; }
  }
  const sel = S.dashSel;
  const svg = `<svg viewBox="0 0 ${W_} ${H_}" width="${W_}" height="${H_}" style="display:block">
    <defs><marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4 0 8z" fill="#A3A7BD"/></marker></defs>
    <rect x="${X(TH)}" y="${pt}" width="${X(hi)-X(TH)}" height="${Y(TH)-pt}" fill="var(--sky2)"/>
    <rect x="${X(TH2)}" y="${pt}" width="${X(hi)-X(TH2)}" height="${Y(TH2)-pt}" fill="var(--sky)"/>
    ${ticks.map(v=>{ const k=v===TH||v===TH2; return `<line x1="${X(v)}" x2="${X(v)}" y1="${pt}" y2="${H_-pb}" stroke="${k?"#9AA0BC":"#EEF0F6"}" ${k?'stroke-dasharray="4 4"':""}/><line x1="${pl}" x2="${W_-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="${k?"#9AA0BC":"#EEF0F6"}" ${k?'stroke-dasharray="4 4"':""}/>
      <text x="${X(v)}" y="${H_-pb+15}" font-size="11" fill="var(--mute)" text-anchor="middle">${v}</text><text x="${pl-8}" y="${Y(v)+4}" font-size="11" fill="var(--mute)" text-anchor="end">${v}</text>`; }).join("")}
    <text x="${X(TH2)+8}" y="${pt+16}" font-size="11.5" font-weight="700" fill="var(--blue)">Priorizar ≥ 70</text>
    <text x="${X(TH)+6}" y="${Y(TH)-8}" font-size="11" font-weight="700" fill="var(--azure)">Explorar ≥ 60</text>
    <text x="${pl+8}" y="${pt+16}" font-size="11" font-weight="600" fill="var(--mute)">Atractivo para CEMEX, difícil de vender</text>
    <text x="${pl+8}" y="${H_-pb-8}" font-size="11" font-weight="600" fill="var(--mute)">Rediseñar</text>
    <text x="${X(TH)+8}" y="${H_-pb-8}" font-size="11" font-weight="600" fill="var(--mute)">Solo para el concretero</text>
    <text x="${(pl+W_-pr)/2}" y="${H_-6}" font-size="12" font-weight="600" fill="var(--amber-d)" text-anchor="middle">Atractivo para el concretero (puntos, desde el cliente elegido)</text>
    <text transform="translate(13 ${(pt+H_-pb)/2}) rotate(-90)" font-size="12" font-weight="600" fill="var(--blue)" text-anchor="middle">Atractivo para CEMEX (puntos)</text>
    ${ghost?pts.map(p=>{ const gx=X(p.r.pcc), gy=Y(p.r.pcx); const d=Math.hypot(p.x-gx,p.y-gy); if(d<R*1.2) return ""; const ux=(p.x-gx)/d, uy=(p.y-gy)/d;
      return `<circle cx="${gx}" cy="${gy}" r="${R*.55}" fill="none" stroke="#A3A7BD" stroke-dasharray="2 2"/><line x1="${gx+ux*R*.6}" y1="${gy+uy*R*.6}" x2="${p.x-ux*(R+3)}" y2="${p.y-uy*(R+3)}" stroke="#A3A7BD" stroke-width="1.3" marker-end="url(#ah)"/>`; }).join(""):""}
    ${pts.map((p,i)=>{ const act=SCH[p.id].tipo==="actual", on=p.id===sel, dr=p.r.n>1?Math.min(R*1.8,R+p.r.disp*.9):0;
      return `<g class="pt" data-dsel="${p.id}" data-tipid="${p.id}" style="cursor:pointer;transform-origin:${p.x}px ${p.y}px;${S.anim?`animation:pop .5s ${i*45}ms both`:""}">
        ${dr>R+1?`<circle cx="${p.x}" cy="${p.y}" r="${dr}" fill="${act?"#8A8FA8":"var(--amber)"}" opacity=".18"/>`:""}
        ${on?`<circle cx="${p.x}" cy="${p.y}" r="${R+5}" fill="none" stroke="var(--blue)" stroke-width="2.5"/>`:""}
        <circle cx="${p.x}" cy="${p.y}" r="${R}" fill="${act?"#8A8FA8":"var(--amber)"}" stroke="#fff" stroke-width="2"/>
        <text x="${p.x}" y="${p.y+4}" text-anchor="middle" font-size="${R>13?12:11}" font-weight="700" fill="${act?"#fff":"var(--ink)"}" pointer-events="none">${p.id}</text>
        ${on?`<text x="${p.x+R+9}" y="${p.y+4}" font-size="12.5" font-weight="600" fill="var(--blue)" paint-order="stroke" stroke="#fff" stroke-width="4">${esc(SCH[p.id].name)}${p.r.cli?` · ${cliLetter(p.r.cli)}`:""}</text>`:""}
      </g>`; }).join("")}
  </svg>`;
  S.anim = false;
  host.innerHTML = svg;
}

/* ============================================================
   INTERACCIÓN
   ============================================================ */
function toast(msg){ $$(".toast").forEach(t=>t.remove()); const t=document.createElement("div"); t.className="toast"; t.style.zoom=Z; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2600); }
function modal(html){ closeModal(); const bg=document.createElement("div"); bg.className="modal-bg"; bg.innerHTML=`<div class="modal" role="dialog" style="zoom:${Z}">${html}</div>`; bg.onclick=e=>{ if(e.target===bg) closeModal(); }; document.body.appendChild(bg); }
function closeModal(){ $$(".modal-bg").forEach(m=>m.remove()); }
function download(name, text, type="application/json"){ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([text],{type})); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},200); }

function openMenu(btn){
  closePop();
  const m=document.createElement("div"); m.className="menu";
  m.innerHTML = `<div class="lbl">${esc(S.user)}</div>
    <button data-m="switch">${ic("out",16)} Cambiar de usuario</button><hr>
    <button data-m="csv">${ic("dl",16)} Descargar resultados (Excel/CSV)</button>
    <button data-m="backup">${ic("dl",16)} Descargar respaldo de datos</button>
    ${S.admin?`<button data-m="import">${ic("ul",16)} Importar evaluaciones o respaldo</button>`:""}
    <hr><div class="lbl" style="font-weight:400">${Store.remoto?"Datos compartidos en línea":"Modo local: los datos viven en este navegador"}</div>`;
  document.body.appendChild(m);
  const r=btn.getBoundingClientRect(); place(m, r.left, r.top - m.offsetHeight*Z - 6);
  m.onclick = e => { const b=e.target.closest("[data-m]"); if(!b) return; closePop(); menuAct(b.dataset.m); };
}
function menuAct(k){
  if(k==="switch"){ S.user=null; S.my=null; S.admin=false; render(); }
  if(k==="backup") download(`evaluacion_esquemas_respaldo_${new Date().toISOString().slice(0,10)}.json`, JSON.stringify({config:S.cfg, evaluaciones:S.evals},null,1));
  if(k==="csv") exportCSV();
  if(k==="import"){ const i=document.createElement("input"); i.type="file"; i.accept=".json,application/json"; i.onchange=async()=>{ try{ const j=JSON.parse(await i.files[0].text()); await importData(j); }catch(e){ toast("No se pudo leer el archivo: "+e.message); } }; i.click(); }
}
async function importData(j){
  const evs = j.evaluaciones ? Object.values(j.evaluaciones) : (j.evaluador ? [j] : []);
  let n=0;
  for(const e of evs){ if(!e||!e.evaluador) continue; const k=Object.keys(S.evals).find(x=>norm(x)===norm(e.evaluador)); const cur=k?S.evals[k]:null;
    if(!cur || (e.updatedAt||"")>(cur.updatedAt||"")){ S.evals[e.evaluador]=e; await Store.saveEval(e); n++; } }
  if(j.config && (j.config.rev||0)>(S.cfg.rev||0)){ S.cfg=Object.assign(defaultConfig(), j.config); await Store.saveConfig(S.cfg); }
  toast(`${n} evaluaci${n===1?"ón importada":"ones importadas"}`); render();
}
function exportCSV(){
  const agg = aggregate(S.cfg.weights);
  const q = v => `"${String(v??"").replace(/"/g,'""')}"`;
  const hdr = ["Orden","Esquema","Evaluaciones", ...CLI().map(c=>"Votos cliente: "+c.t), ...CRIT.cc.map(c=>"Concretero: "+c.label), "Puntaje concretero", ...CRIT.cx.map(c=>"CEMEX: "+c.label), "Puntaje CEMEX", "Puntaje combinado", "Preliminar concretero", "Preliminar CEMEX", "Cuadrante", "Desacuerdo (pts)"];
  const rows = S.cfg.order.map((id,i)=>{ const r=agg[id]; return [i+1, `${id} ${SCH[id].name}`, r.n, ...CLI().map(c=>r.cli?(r.votes[c.k]||0):""), ...CRIT.cc.map(c=>round(r.mean.cc[c.id],2)), round(r.cc,1), ...CRIT.cx.map(c=>round(r.mean.cx[c.id],2)), round(r.cx,1), round(r.comb,1), round(r.pcc,1), round(r.pcx,1), r.q.t, round(r.disp,1)]; });
  const com = [["Esquema","Eje","Tipo","Comentario"]];
  for(const id of S.cfg.order){ const cm=commentsFor(id); for(const [k,lab] of [["cc_pro","Concretero","Pro"],["cc_con","Concretero","Contra"],["cx_pro","CEMEX","Pro"],["cx_con","CEMEX","Riesgo"]].map(x=>[x[0],x])) cm[k].forEach(c=>com.push([`${id} ${SCH[id].name}`, lab[1], lab[2], c.t])); }
  const txt = "\ufeff" + [hdr, ...rows].map(r=>r.map(q).join(",")).join("\n") + "\n\nComentarios\n" + com.map(r=>r.map(q).join(",")).join("\n");
  download(`resultados_esquemas_${new Date().toISOString().slice(0,10)}.csv`, txt, "text/csv;charset=utf-8");
}

document.addEventListener("click", async e => {
  const t = e.target;
  if(!t.closest(".pop,.menu") ) closePop();
  if(t.closest("#whoBtn")){ e.stopPropagation(); openMenu(t.closest("#whoBtn")); return; }
  const clo = t.closest("[data-close]"); if(clo) closeModal();
  const g = t.closest("[data-go]"); if(g){ if(g.dataset.go==="dashboard") S.anim=true; go(g.dataset.go, g.dataset.gosub); return; }
  const sb = t.closest("[data-sub]"); if(sb){ S.sub[S.sec]=sb.dataset.sub; render(); return; }
  const fi = t.closest("[data-ficha]"); if(fi){ S.evSel=fi.dataset.ficha; go("evaluacion"); return; }
  const ev = t.closest("[data-ev]"); if(ev && !ev.disabled){ S.evSel=ev.dataset.ev; if(S.sec!=="evaluacion") go("evaluacion"); else { renderNav(); renderMain(); } return; }
  const cl = t.closest("[data-cli]"); if(cl){ toggleCli(cl.dataset.cli); return; }
  const sc = t.closest("[data-score]"); if(sc){ const [ax,c,v]=sc.dataset.score.split("|"); setScore(ax,c,+v); return; }
  const nt = t.closest("[data-nt]"); if(nt){ const k=nt.dataset.nt; openNotes.has(k)?openNotes.delete(k):openNotes.add(k); const keep=$(".ev-main").scrollTop; renderMain(); $(".ev-main").scrollTop=keep; $(`[data-note="${k}"]`)?.focus(); return; }
  const rw = t.closest("[data-row]"); if(rw){ S.mxSel = S.mxSel===rw.dataset.row ? null : rw.dataset.row; renderMain(); return; }
  const mv = t.closest("[data-mv]"); if(mv && S.admin && S.mxSel){ const o=S.cfg.order, i=o.indexOf(S.mxSel), j=i+(+mv.dataset.mv); if(j<0||j>=o.length) return; [o[i],o[j]]=[o[j],o[i]]; renderMain(); flash(".row-sel"); saveConfig(); return; }
  const ws = t.closest("[data-wst]"); if(ws && S.admin){ const [ax,c,d]=ws.dataset.wst.split("|"); wDraft ||= clone(S.cfg.weights); wDraft[ax][c]=Math.max(0,Math.min(100,(+wDraft[ax][c]||0)+(+d))); renderMain(); return; }
  if(t.closest("[data-win]")) return;
  const wsl = t.closest("[data-wsel]"); if(wsl){ const [ax,c]=wsl.dataset.wsel.split("|"); S.wSel[ax] = S.wSel[ax]===c ? null : c; renderMain(); return; }
  const rs = t.closest("[data-res]"); if(rs){ S.resSel=rs.dataset.res; renderMain(); return; }
  const rm = t.closest("[data-rmode]"); if(rm){ S.sub.resultados=rm.dataset.rmode; renderMain(); return; }
  const cf = t.closest("[data-cf]"); if(cf){ S.cliente=cf.dataset.cf; renderMain(); return; }
  const rso = t.closest("[data-rsort]"); if(rso){ S.resSort=rso.dataset.rsort; renderMain(); return; }
  const ds = t.closest("[data-dsel]"); if(ds){ S.dashSel=ds.dataset.dsel; renderMain(); return; }
  const ln = t.closest("[data-lens]"); if(ln){ S.sub.dashboard=ln.dataset.lens; renderMain(); return; }
  const a = t.closest("[data-act]"); if(!a) return;
  const act = a.dataset.act;
  if(act==="send") trySend();
  if(act==="confirmSend"){ S.my.enviada=true; S.my.enviadaAt=new Date().toISOString(); queueSave(); render(); toast("Evaluación enviada. Gracias."); }
  if(act==="togglePrelim"){ S.showPrelim=a.checked; renderMain(); }
  if(act==="toggleGhost"){ S.ghost=a.checked; drawScatter(); }
  if(act==="usePrelim"){ const f=S.my.fichas[S.evSel] ||= blankFicha(); let k=0; for(const ax of ["cc","cx"]) CRIT[ax].forEach((c,i)=>{ if(!f[ax][c.id]){ f[ax][c.id]=SCH[S.evSel].p[ax][i]; k++; } }); if(needsCli(S.evSel) && !(f.clientes||[]).length && SCH[S.evSel].natural){ f.clientes=[SCH[S.evSel].natural]; k++; } if(k){ queueSave(); renderMain(); renderHeader(); toast(`Se llenó lo pendiente con la preliminar (cliente natural incluido); ajústalo a tu criterio`); } else toast("Ya calificaste todos los criterios"); }
  if(act==="resetMx" && S.admin) modal(`<h3>Restablecer la matriz</h3><p>Se regresan el orden de las filas y todas las celdas a la versión de la presentación. Los pesos no cambian.</p><div class="acts"><button class="btn" data-close>Cancelar</button><button class="btn pri" data-close data-act="resetMxOk">Restablecer</button></div>`);
  if(act==="resetMxOk"){ const d=defaultConfig(); S.cfg.order=d.order; S.cfg.cells=d.cells; renderMain(); saveConfig("Matriz restablecida"); }
  if(act==="resetW"){ wDraft = defaultConfig().weights; renderMain(); }
  if(act==="cancelW"){ wDraft=null; renderMain(); }
  if(act==="saveW"){ S.cfg.weights=wDraft; wDraft=null; renderMain(); saveConfig("Pesos guardados: los puntajes se recalcularon"); }
  if(act==="simReset"){ S.simW=null; renderMain(); }
  if(act==="editCli" && S.admin) modal(`<h3>Tipos de cliente</h3><p>Los nombres y descripciones se actualizan para todos. Las calificaciones ya hechas conservan su tipo.</p>
    ${CLI().map(c=>`<div class="fld"><label>${c.k==="n"?"Sin cliente natural":"Tipo "+c.k.toUpperCase()}</label><input class="inp" data-cn="${c.k}" value="${esc(c.t)}" style="padding:8px 10px"><input class="inp" data-cd="${c.k}" value="${esc(c.d)}" style="padding:7px 10px;font-size:13px"></div>`).join("")}
    <div class="acts"><button class="btn" data-close>Cancelar</button><button class="btn pri" data-act="saveCli">Guardar</button></div>`);
  if(act==="saveCli" && S.admin){ S.cfg.clientes = CLI().map(c=>({k:c.k, t:($(`[data-cn="${c.k}"]`).value.trim()||c.t), d:$(`[data-cd="${c.k}"]`).value.trim()})); closeModal(); render(); saveConfig("Tipos de cliente actualizados"); }
});
document.addEventListener("dblclick", e => {
  const c = e.target.closest("[data-cell]"); if(!c || !$(".mx")) return;
  if(!S.admin){ toast(`Solo ${ADMINS[0]} puede cambiar la matriz`); return; }
  openCellPop(c);
});
document.addEventListener("input", e => {
  const t = e.target;
  if(t.dataset.pc){ const f=S.my.fichas[S.evSel] ||= blankFicha(); f[t.dataset.pc]=t.value; queueSave(); updateStatusLite(); }
  if(t.dataset.note){ const f=S.my.fichas[S.evSel] ||= blankFicha(); f.notas[t.dataset.note]=t.value; queueSave(); }
  if(t.dataset.win && S.admin){ const [ax,c]=t.dataset.win.split("|"); wDraft ||= clone(S.cfg.weights); wDraft[ax][c]=Math.max(0,Math.min(100,+t.value||0)); }
  if(t.dataset.sim){ const [ax,c]=t.dataset.sim.split("|"); S.simW ||= clone(S.cfg.weights); S.simW[ax][c]=+t.value; clearTimeout(simT); simT=setTimeout(()=>{ renderMain(); $(`[data-sim="${ax}|${c}"]`)?.focus(); }, 120); }
});
let simT=null;
document.addEventListener("change", e => { if(e.target.dataset.win){ renderMain(); } });
document.addEventListener("keydown", e => { if(e.key==="Escape"){ closePop(); closeModal(); } });
/* vista previa del ancla al pasar sobre una calificación */
document.addEventListener("mouseover", e => {
  const d = e.target.closest("[data-score]");
  if(d){ const [ax,c,v]=d.dataset.score.split("|"); const cr=CRIT[ax].find(x=>x.id===c); const el=$("#an_"+ax+"_"+c); if(el) el.innerHTML = anchorText(cr,+v); return; }
  const pt = e.target.closest("[data-tipid]");
  if(pt){ showTip(pt); return; }
  hideTip();
});
document.addEventListener("mouseout", e => {
  const d = e.target.closest("[data-crit]");
  if(d && !d.contains(e.relatedTarget)){ const [ax,c]=d.dataset.crit.split("|"); const cr=CRIT[ax].find(x=>x.id===c); const f=S.my&&S.my.fichas[S.evSel]; const el=$("#an_"+ax+"_"+c); if(el) el.innerHTML = anchorText(cr, f&&f[ax][c]); }
});
function showTip(g){
  const id=g.dataset.tipid, r=aggregate()[id]; let t=$(".tip"); if(!t){ t=document.createElement("div"); t.className="tip"; document.body.appendChild(t); }
  t.innerHTML = `<b>${esc(id)} ${esc(SCH[id].name)}</b><br>Concretero ${Math.round(r.cc)} · CEMEX ${Math.round(r.cx)}<br>${r.q.t}${r.cli?`<br>Cliente: ${esc(cliName(r.cli))}`:""}${r.n?`<br>${r.n} evaluaci${r.n>1?"ones":"ón"}${r.n>1?`, desacuerdo ±${Math.round(r.disp)} pts`:""}`:"<br>Calificación preliminar"}`;
  const b=g.getBoundingClientRect(); place(t, b.right+8, b.top-6);
}
function hideTip(){ $$(".tip").forEach(t=>t.remove()); }
function updateStatusLite(){
  const it = $(`.nv-ev[data-ev="${S.evSel}"]`); if(!it) return;
  const st = fichaStatus(S.my.fichas[S.evSel], S.evSel);
  it.title = st.done?"Completa":st.n?`${st.n} de ${st.total} respuestas`:"Sin iniciar";
  it.querySelector(".ring").outerHTML = ringSVG(st.n,st.total,st.done);
}
window.addEventListener("resize", ()=>{ fit(); clearTimeout(window._rz); window._rz=setTimeout(()=>{ if(S.sec==="dashboard") drawScatter(); },120); });
window.addEventListener("storage", e => { if(!Store.remoto && e.key && e.key.startsWith(LK)) pull(true); });

/* dibuja la gráfica cuando el dashboard está en pantalla */
const _rm = renderMain;
renderMain = function(){ _rm(); if(S.sec==="dashboard") requestAnimationFrame(drawScatter); };

/* ============================================================
   INICIO
   ============================================================ */
(async function init(){
  try{ const pend = JSON.parse(localStorage.getItem(LK+"pendiente")||"null"); if(pend && Store.remoto){ await Store.saveEval(pend); localStorage.removeItem(LK+"pendiente"); } }catch(e){}
  fit();
  await pull(true);
  render();
  if(Store.remoto) setInterval(()=>pull(true), (EC.intervaloSeg||20)*1000);
  setInterval(renderSync, 15000);
})();

</script>
