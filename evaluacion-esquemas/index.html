:root{
  --blue:#0003AA; --blue-d:#00027A; --azure:#2F80ED; --sky:#DCEBFC; --sky2:#EEF5FE;
  --amber:#FFB400; --amber-d:#B87A00; --amber-l:#FFF3D6;
  --red:#F22230; --red-l:#FDE6E8; --green:#0E9F6E; --green-l:#DFF5EC;
  --ink:#151838; --ink2:#3B3F5C; --mute:#6E7391; --faint:#A3A7BD;
  --line:#E2E5EF; --line2:#EEF0F6; --bg:#F4F5F9; --white:#fff;
  --r:10px; --r-s:6px;
  --hdr:58px; --sub:46px;
  font-family:"Outfit",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased}
body{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--azure);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- App shell ---------- */
#app{position:fixed;left:0;top:0;width:1480px;height:840px;transform-origin:0 0;display:grid;grid-template-columns:236px minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
.hdr{display:flex;align-items:center;gap:18px;overflow:hidden;padding:0 22px;background:var(--white);border-bottom:1px solid var(--line);position:relative;z-index:20}
.hdr .logo{height:17px;display:block}
.hdr .ttl{font-weight:600;font-size:15px;color:var(--blue);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto;padding-left:18px;border-left:1px solid var(--line);line-height:1.15}
.hdr .ttl small{display:block;font-weight:400;font-size:11.5px;color:var(--mute)}
.steps{display:flex;gap:2px;margin:0 auto;flex:none;background:var(--bg);padding:4px;border-radius:999px}
.step{display:flex;align-items:center;gap:7px;padding:6px 12px 6px 6px;border-radius:999px;color:var(--ink2);font-weight:500;font-size:13.5px;white-space:nowrap;transition:background .15s,color .15s}
.step .n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;background:var(--white);color:var(--blue);border:1px solid var(--line)}
.step:hover{background:#E9EBF3}
.step.on{background:var(--blue);color:#fff}
.step.on .n{background:#fff;color:var(--blue);border-color:#fff}
.step .badge{font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--amber-l);color:var(--amber-d)}
.step.on .badge{background:rgba(255,255,255,.2);color:#fff}
.step .badge.done{background:var(--green-l);color:var(--green)}
.hright{display:flex;align-items:center;gap:12px;flex:none}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mute);white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--green)}
.sync.local i{background:var(--amber)} .sync.err i{background:var(--red)}
.who{display:flex;align-items:center;gap:9px;padding:4px 10px 4px 4px;border-radius:999px;border:1px solid var(--line)}
.who:hover{background:var(--bg)}
.av{width:30px;height:30px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:600;font-size:12px}
.who .nm{font-size:13px;font-weight:500;line-height:1.1;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who .nm small{display:block;font-size:11px;color:var(--mute);font-weight:400}
.who .nm small.adm{color:var(--red);font-weight:600}

.subbar{display:flex;align-items:center;gap:6px;padding:0 22px;height:var(--sub);background:var(--white);border-bottom:1px solid var(--line)}
.subbar:empty{display:none}
.stab{padding:7px 13px;border-radius:7px;font-size:13.5px;font-weight:500;color:var(--mute);display:flex;align-items:center;gap:7px}
.stab:hover{color:var(--ink);background:var(--bg)}
.stab.on{color:var(--blue);background:var(--sky2);box-shadow:inset 0 -2px 0 var(--blue)}
.stab .k{font-size:11px;color:var(--faint);font-weight:600}
.subbar .sp{flex:1}
.subbar .hint{font-size:12.5px;color:var(--mute)}

main{overflow:hidden;position:relative}
.view{height:100%;padding:18px 22px;display:flex;flex-direction:column;gap:14px;overflow:auto}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:20px}
.vh h1{margin:0;font-size:24px;font-weight:500;color:var(--blue);letter-spacing:-.01em}
.vh p{margin:2px 0 0;color:var(--ink2);font-size:14.5px;font-weight:500}
.vh .tools{display:flex;gap:8px;align-items:center}

.panel{background:var(--white);border:1px solid var(--line);border-radius:var(--r)}
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:8px;font-weight:500;font-size:13.5px;background:var(--white);border:1px solid var(--line);white-space:nowrap}
.btn:hover{border-color:#C9CDDD;background:#FAFBFD}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.pri:hover{background:var(--blue-d)}
.btn.pri:disabled{background:#B9BBD9;border-color:#B9BBD9;cursor:not-allowed}
.btn.ghost{border-color:transparent;background:transparent;color:var(--mute)}
.btn.ghost:hover{background:var(--bg);color:var(--ink)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn svg{width:15px;height:15px}
.ic{width:18px;height:18px;display:inline-block;vertical-align:middle}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:500;background:var(--bg);color:var(--ink2)}
.num{display:inline-grid;place-items:center;min-width:24px;height:24px;padding:0 4px;border-radius:50%;background:var(--amber);color:var(--ink);font-weight:600;font-size:11.5px;flex:none}
.num.act{background:#8A8FA8;color:#fff}
.num.lg{min-width:34px;height:34px;font-size:14px}
.muted{color:var(--mute)}
.note{font-size:12.5px;color:var(--mute)}
.admin-bar{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:8px;background:var(--red-l);color:#9B1520;font-size:12.5px;font-weight:500}
.admin-bar b{font-weight:600}
.banner{display:flex;gap:12px;align-items:center;padding:11px 16px;border-radius:var(--r);background:var(--bg);font-size:13.5px}
.banner b{color:var(--blue);font-weight:600}
.banner.blue{background:var(--blue);color:#fff} .banner.blue b{color:#fff}

/* ---------- Login ---------- */
.login{position:fixed;inset:0;display:grid;grid-template-columns:1.1fr 1fr;background:var(--white);z-index:100}
.login .lft{background:var(--blue);color:#fff;padding:56px 64px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.login .lft h1{font-size:44px;line-height:1.05;font-weight:500;margin:0 0 18px;letter-spacing:-.02em;max-width:520px}
.login .lft p{font-size:16px;opacity:.85;max-width:460px;margin:0}
.login .lft .path{display:flex;flex-direction:column;gap:14px;margin-top:40px}
.login .lft .path div{display:flex;gap:14px;align-items:baseline;font-size:15px}
.login .lft .path span{font-weight:600;width:22px;opacity:.6}
.login .stripes{position:absolute;right:-40px;top:0;height:100%;width:auto;opacity:.1}
.login .rgt{display:flex;align-items:center;justify-content:center;padding:40px}
.lcard{width:380px}
.lcard img{height:22px;margin-bottom:34px}
.lcard h2{margin:0 0 6px;font-size:22px;font-weight:500}
.lcard p{margin:0 0 24px;color:var(--mute)}
.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.fld label{font-size:12.5px;font-weight:600;color:var(--ink2)}
.inp{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--white);font-size:14.5px}
.inp:focus{outline:none;border-color:var(--azure);box-shadow:0 0 0 3px var(--sky)}
.lcard .btn.pri{width:100%;justify-content:center;padding:12px;font-size:15px;margin-top:8px}
.lcard .err{color:var(--red);font-size:12.5px;min-height:18px}

/* ---------- Contexto: objetivos ---------- */
.obj-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.obj{padding:22px;display:flex;flex-direction:column;gap:12px;border-top:4px solid var(--blue)}
.obj .top{display:flex;justify-content:space-between;align-items:center}
.obj .top b{font-size:30px;color:var(--red);font-weight:600;letter-spacing:-.02em}
.obj .top .icw .ic{width:24px;height:24px}
.obj .top .icw{width:46px;height:46px;border-radius:50%;background:var(--sky);display:grid;place-items:center;color:var(--blue)}
.obj h3{margin:0;font-size:19px;color:var(--blue);font-weight:600;line-height:1.15}
.obj p{margin:0;color:var(--ink2);font-size:14px}
.obj .eq{margin-top:auto;border-top:1px solid var(--line2);padding-top:12px;display:flex;flex-direction:column;gap:7px}
.obj .eq span{font-size:12px;color:var(--mute);font-weight:500}
.obj .eq div{display:flex;flex-wrap:wrap;gap:5px}
.obj .eq i{font-style:normal;font-size:12px;font-weight:500;padding:3px 9px;border-radius:999px}
.obj .eq i.cc{background:var(--amber-l);color:#7A5200}.obj .eq i.cx{background:var(--sky2);color:var(--blue)}
.journey{display:grid;grid-template-columns:repeat(5,1fr);gap:0;padding:14px 18px}
.journey .j{display:flex;gap:10px;align-items:flex-start;padding-right:14px;position:relative}
.journey .j .n{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--blue);color:var(--blue);display:grid;place-items:center;font-weight:600;font-size:12px;flex:none}
.journey .j b{display:block;font-size:13.5px;font-weight:600}
.journey .j span{font-size:12.5px;color:var(--mute)}

/* ---------- Cadena de valor ---------- */
.cad{padding:22px 22px 18px;display:flex;flex-direction:column;gap:16px}
.bands{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.band{border-top:3px solid;padding-top:8px;font-size:12.5px}
.band b{display:block;font-size:12.5px;font-weight:700;margin-bottom:2px}
.band.f{border-color:var(--blue);grid-column:span 3} .band.f b{color:var(--blue)}
.band.b{border-color:var(--red);grid-column:span 2} .band.b b{color:var(--red)}
.band.p{border-color:var(--azure);grid-column:span 2} .band.p b{color:var(--azure)}
.chain{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.link{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px}
.link .chev{width:100%;height:48px;display:grid;place-items:center;color:#fff;font-weight:600;font-size:14.5px;clip-path:polygon(0 0,calc(100% - 14px) 0,100% 50%,calc(100% - 14px) 100%,0 100%,14px 50%)}
.link:first-child .chev{clip-path:polygon(0 0,calc(100% - 14px) 0,100% 50%,calc(100% - 14px) 100%,0 100%)}
.link.f .chev{background:var(--blue)} .link.b .chev{background:var(--azure)} .link.p .chev{background:#7DB3F5}
.link .d{font-size:12.5px;color:var(--ink2);max-width:150px}
.capi{font-size:11px;font-weight:600;color:var(--red);border:1.5px solid var(--red);padding:2px 9px;border-radius:999px}
.trans{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.trans div{background:var(--bg);border-radius:8px;padding:10px 12px}
.trans b{display:block;color:var(--blue);font-size:13.5px}
.trans span{font-size:12.5px;color:var(--mute)}
.seclbl{font-size:12px;font-weight:600;color:var(--mute)}

/* ---------- Habilitadores ---------- */
.hab{display:grid;grid-template-columns:1.1fr 1fr 1fr;grid-template-rows:44px repeat(7,minmax(46px,1fr));flex:1;min-height:0;overflow:hidden}
.hab > div{padding:12px 16px;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:12px;font-size:14px}
.hab .h{font-weight:600;color:#fff;font-size:13.5px;border:0}
.hab .h1{background:var(--blue);border-radius:var(--r) 0 0 0}.hab .h2{background:var(--azure)}.hab .h3{background:var(--amber);color:var(--ink);border-radius:0 var(--r) 0 0}
.hab .t b{display:block;color:var(--blue);font-size:14px}
.hab .t span{font-size:12px;color:var(--mute)}
.hab .icw{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--blue);display:grid;place-items:center;color:var(--blue);flex:none}
.hab .alt{background:#FAFBFD}

/* ---------- Matriz de esquemas ---------- */
.mx-wrap{display:flex;flex-direction:column;min-height:0;flex:1}
.mx{display:grid;grid-template-columns:30px 210px repeat(5,minmax(92px,1fr)) 14px repeat(4,minmax(92px,1fr));gap:5px 5px;align-content:start;user-select:none}
.mx .gh{font-size:11.5px;font-weight:700;text-align:center;padding-bottom:2px}
.mx .gh.c{color:var(--red);grid-column:3 / span 5}
.mx .gh.t{color:var(--blue);grid-column:9 / span 4}
.mx .ch{font-size:12px;font-weight:600;text-align:center;align-self:end;line-height:1.15;padding:2px}
.mx .ch.c{color:var(--red)} .mx .ch.t{color:var(--blue)}
.mx .rh{display:flex;align-items:center;gap:9px;font-weight:600;font-size:13.5px;padding:0 8px;border-radius:8px;cursor:pointer;min-height:44px}
.mx .rh.act{color:var(--mute);font-weight:500}
.mx .rk{display:grid;place-items:center;font-size:11px;color:var(--faint);font-weight:600}
.mx .cell{min-height:44px;border-radius:8px;display:grid;place-items:center;text-align:center;font-size:11.5px;font-weight:600;line-height:1.15;padding:4px 5px;border:1.5px solid;cursor:default;position:relative;transition:transform .12s, box-shadow .12s}
.mx .cell small{display:block;font-weight:500;font-size:10.5px}
.cell.cx{background:var(--azure);border-color:var(--azure);color:#fff}
.cell.mix{background:var(--sky);border-color:#9CC5F6;color:var(--blue)}
.cell.ter{background:#fff;border-color:#CDD1DE;color:var(--ink2)}
.mx.editable .cell{cursor:pointer}
.mx.editable .cell:hover{box-shadow:0 0 0 2px var(--blue)}
.mx .rh.row-sel{background:var(--sky2)}
.mx .rh.row-sel{box-shadow:inset 3px 0 0 var(--blue)}
.mx .cell.row-sel{transform:translateY(-1px);box-shadow:0 2px 6px rgba(0,3,170,.15)}
.mx .sep{background:var(--line2);border-radius:3px}
.mx .flash{animation:flash .6s}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--amber)}100%{box-shadow:0 0 0 0 transparent}}
.legend{display:flex;gap:18px;align-items:center;font-size:12.5px;color:var(--mute)}
.legend i{display:inline-block;width:26px;height:14px;border-radius:4px;border:1.5px solid;vertical-align:-2px;margin-right:6px}
.legend .cx{background:var(--azure);border-color:var(--azure)}.legend .mix{background:var(--sky);border-color:#9CC5F6}.legend .ter{background:#fff;border-color:#CDD1DE}
.mx-tools{display:flex;align-items:center;gap:8px}
.arrowbtn{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:#fff;display:grid;place-items:center}
.arrowbtn:hover:not(:disabled){border-color:var(--blue);color:var(--blue)}
.arrowbtn:disabled{opacity:.35;cursor:not-allowed}
.axis-v{writing-mode:vertical-rl;transform:rotate(180deg);font-weight:700;color:var(--blue);font-size:12.5px;display:flex;align-items:center;gap:8px;justify-content:center}
.pop{position:fixed;z-index:60;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 32px rgba(21,24,56,.18);width:290px;padding:8px;max-height:400px;display:flex;flex-direction:column}
.pop h4{margin:4px 6px 8px;font-size:12.5px;color:var(--mute);font-weight:600}
.pop .opts{overflow:auto;display:flex;flex-direction:column;gap:2px}
.pop .opt{display:flex;align-items:center;gap:8px;text-align:left;padding:7px 8px;border-radius:6px;font-size:13px}
.pop .opt:hover,.pop .opt.on{background:var(--sky2)}
.pop .opt i{width:14px;height:14px;border-radius:4px;border:1.5px solid;flex:none}
.pop .other{display:flex;gap:6px;margin-top:6px;border-top:1px solid var(--line2);padding-top:8px}
.pop .other .inp{padding:7px 9px;font-size:13px}

/* ---------- Mapa ---------- */
.mapa{display:grid;grid-template-columns:1fr 300px;gap:16px;flex:1;min-height:0}
.mapbox{padding:18px 18px 34px 46px;position:relative;display:flex}
.mgrid{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr .62fr 1fr;gap:8px}
.mq{border-radius:10px;padding:12px 14px;background:var(--bg);display:flex;flex-direction:column;gap:8px}
.mq.hi{background:var(--sky)}
.mq.mix{background:#fff;border:2px solid var(--blue)}
.mq h5{margin:0;font-size:12px;font-weight:700;color:var(--mute)}
.mq.hi h5,.mq.mix h5{color:var(--blue)}
.mq .it small{display:block;font-size:12px;color:var(--mute);font-weight:400}
.mq .it{text-align:left;display:flex;align-items:center;gap:10px;font-size:14.5px;font-weight:500;cursor:pointer;padding:3px 4px;border-radius:6px}
.mq .it:hover{background:rgba(255,255,255,.7)}
.mapbox .ax-x{position:absolute;left:46px;right:18px;bottom:8px;display:flex;justify-content:space-between;font-size:12.5px;color:var(--mute)}
.mapbox .ax-x b,.mapbox .ax-y b{color:var(--ink);font-weight:600}
.mapbox .ax-y{position:absolute;left:10px;top:18px;bottom:34px;writing-mode:vertical-rl;transform:rotate(180deg);display:flex;justify-content:space-between;font-size:12.5px;color:var(--mute)}
.howto{padding:0;overflow:hidden;display:flex;flex-direction:column}
.howto .hd{background:var(--blue);color:#fff;font-weight:600;padding:12px 16px}
.howto .bd{padding:14px 16px;display:flex;flex-direction:column;gap:14px;font-size:13.5px}
.howto .bd b{color:var(--blue)}
.howto .bd .box{background:var(--bg);border-radius:8px;padding:10px 12px}

/* ---------- Criterios ---------- */
.w-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;flex:1;min-height:0}
.wcol{display:flex;flex-direction:column;overflow:hidden}
.wcol .hd{display:flex;align-items:center;gap:12px;padding:12px 16px;font-weight:600;font-size:15px}
.wcol.cc .hd{background:var(--amber);color:var(--ink)}
.wcol.cx .hd{background:var(--blue);color:#fff}
.wcol .hd .icw{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.9);display:grid;place-items:center;color:var(--blue)}
.wcol.cc .hd .icw{color:var(--amber-d)}
.wcol .hd .tot{margin-left:auto;font-size:13px;font-weight:500;opacity:.9}
.wrow{display:grid;grid-template-columns:1fr 1.1fr 92px;gap:14px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line2);cursor:pointer}
.wrow:hover{background:#FAFBFD}
.wrow.on{background:var(--sky2)}
.wrow .nm{font-size:14px;font-weight:500}
.wbar{height:10px;border-radius:999px;background:var(--line2);overflow:hidden}
.wbar i{display:block;height:100%;border-radius:999px;transition:width .25s}
.cc .wbar i{background:var(--amber)} .cx .wbar i{background:var(--blue)}
.wval{display:flex;align-items:center;justify-content:flex-end;gap:4px;font-weight:600;font-size:14.5px}
.wval .st{width:24px;height:24px;border-radius:6px;border:1px solid var(--line);display:grid;place-items:center;font-size:14px;line-height:1;color:var(--ink2)}
.wval .st:hover{border-color:var(--blue);color:var(--blue)}
.wval input::-webkit-outer-spin-button,.wval input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.wval input{-moz-appearance:textfield;width:42px;text-align:right;border:1px solid var(--line);border-radius:6px;padding:3px 4px;font-weight:600}
.wfoot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;padding:10px 16px;font-size:13px}
.wfoot .ok{color:var(--green);font-weight:600}.wfoot .bad{color:var(--red);font-weight:600}
.anc-peek{padding:12px 16px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:#FAFBFD;border-bottom:1px solid var(--line2)}
.anc-peek div{font-size:12.5px;border-radius:7px;padding:7px 9px;background:#fff;border:1px solid var(--line2)}
.anc-peek b{display:block;font-size:11.5px;margin-bottom:2px}
.formula{text-align:center;font-weight:600;color:var(--blue);background:var(--sky2);border-radius:var(--r);padding:11px;font-size:15px}
.anc{width:100%;border-collapse:separate;border-spacing:0;font-size:13.5px}
.anc th{font-size:12.5px;text-align:left;padding:10px 14px;color:#fff;background:var(--blue);font-weight:600}
.anc.cc th{background:var(--amber);color:var(--ink)}
.anc th:first-child{border-radius:var(--r) 0 0 0}.anc th:last-child{border-radius:0 var(--r) 0 0}
.anc td{padding:12px 14px;border-bottom:1px solid var(--line2);vertical-align:top;background:#fff}
.anc td.c{font-weight:600}
.anc td.w{font-weight:600;color:var(--blue);text-align:center}
.anc .s1{box-shadow:inset 3px 0 0 #F5A3A9}.anc .s3{box-shadow:inset 3px 0 0 #C9CDDD}.anc .s5{box-shadow:inset 3px 0 0 var(--green)}
.anc th.s{width:24%}

/* ---------- Evaluación ---------- */
.ev{display:grid;grid-template-columns:250px 1fr;height:100%;min-height:0}
.ev-side{background:var(--white);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.ev-side .hd{padding:16px 16px 10px}
.ev-side .hd b{font-size:15px;font-weight:600}
.prog{height:6px;background:var(--line2);border-radius:999px;overflow:hidden;margin:8px 0 4px}
.prog i{display:block;height:100%;background:var(--green);border-radius:999px;transition:width .3s}
.ev-list{flex:1;overflow:auto;padding:4px 8px}
.ev-list .grp{font-size:11.5px;color:var(--mute);font-weight:600;padding:10px 8px 4px}
.ev-it{display:flex;align-items:center;gap:10px;width:100%;padding:8px;border-radius:8px;text-align:left}
.ev-it:hover{background:var(--bg)}
.ev-it.on{background:var(--sky2);box-shadow:inset 3px 0 0 var(--blue)}
.ev-it .nm{flex:1;font-size:13.5px;font-weight:500;line-height:1.2}
.ev-it .nm small{display:block;font-size:11.5px;color:var(--mute);font-weight:400}
.ring{width:22px;height:22px;flex:none}
.ev-side .ft{padding:14px 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.ev-side .ft .btn{justify-content:center}
.ev-side .ft .st{font-size:12px;color:var(--mute);text-align:center}
.ev-main{overflow:auto;padding:16px 22px;display:flex;flex-direction:column;gap:12px}
.fhd{display:flex;align-items:center;gap:14px}
.fhd h1{margin:0;font-size:24px;font-weight:500;color:var(--blue)}
.fhd .tags{display:flex;gap:6px}
.fhd .tg{font-size:12px;font-weight:600;padding:4px 12px;border-radius:999px;background:#8A8FA8;color:#fff}
.fhd .tg.o{background:#fff;color:var(--mute);border:1px solid var(--line);font-weight:500}
.fhd .tg.p{background:var(--amber);color:var(--ink)}
.fhd .fnav{margin-left:auto;display:flex;gap:6px;align-items:center;flex:none}
.ftop{display:grid;grid-template-columns:1.25fr 1fr;gap:12px}
.fbox{padding:12px 14px;font-size:13.5px}
.fbox h6{margin:0 0 6px;font-size:12px;color:var(--blue);font-weight:700}
.fbox p{margin:0;color:var(--ink2)}
.fbox .ap{margin-top:8px}.fbox .ap b{color:var(--blue);font-weight:600;margin-right:6px}
.fchain{display:grid;grid-template-columns:repeat(5,1fr) 10px repeat(4,1fr);gap:4px;padding:10px 14px 12px}
.fchain .l{font-size:11px;font-weight:600;color:var(--mute);text-align:center;line-height:1.1;align-self:end;padding-bottom:3px}
.fchain .cell{min-height:36px;border-radius:7px;display:grid;place-items:center;text-align:center;font-size:11px;font-weight:600;line-height:1.1;padding:3px;border:1.5px solid}
.sides{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.side{overflow:hidden;display:flex;flex-direction:column}
.side .hd{display:flex;align-items:center;gap:10px;padding:9px 14px;font-weight:600;font-size:14.5px}
.side.cc .hd{background:var(--amber)} .side.cx .hd{background:var(--blue);color:#fff}
.side .hd .sc{margin-left:auto;font-size:24px;font-weight:600;letter-spacing:-.02em}
.side .hd .sc small{font-size:13px;font-weight:500;opacity:.7}
.side .hd .sc.prov{opacity:.6}
.side .hd .sc em{font-style:normal;font-size:11px;font-weight:500;display:block;text-align:right;margin-top:-4px;opacity:.85}
.crit{display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 12px;padding:5px 14px;border-bottom:1px solid var(--line2)}
.crit .cn{font-size:13.5px;font-weight:500;display:flex;align-items:center;gap:6px}
.crit .cn em{font-style:normal;font-size:11.5px;color:var(--faint);font-weight:600}
.crit .cn .nt{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;color:var(--faint)}
.crit .cn .nt:hover,.crit .cn .nt.has{color:var(--blue);background:var(--sky2)}
.dots{display:flex;gap:4px;position:relative}
.dot{width:30px;height:26px;border-radius:7px;border:1.5px solid var(--line);font-weight:600;font-size:13px;color:var(--mute);position:relative;background:#fff;transition:background .12s,border-color .12s,color .12s}
.dot:hover{border-color:var(--ink2);color:var(--ink)}
.cc .dot.on{background:var(--amber);border-color:var(--amber);color:var(--ink)}
.cx .dot.on{background:var(--blue);border-color:var(--blue);color:#fff}
.dot.pre::after{content:"";position:absolute;left:50%;bottom:-6px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--faint)}
.crit .anchor{grid-column:1 / -1;font-size:12px;color:var(--mute);min-height:0;line-height:1.3;margin-top:-2px}
.crit .anchor b{color:var(--ink2);font-weight:600}
.crit .cnote{grid-column:1 / -1}
.crit .cnote textarea{width:100%;border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:12.5px;resize:vertical;min-height:34px}
.pc{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 14px 12px}
.pc label{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;margin-bottom:4px}
.pc label.p{color:var(--green)} .pc label.c{color:var(--red)}
.pc textarea{width:100%;min-height:74px;resize:vertical;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;line-height:1.45}
.pc textarea:focus,.crit textarea:focus{outline:none;border-color:var(--azure);box-shadow:0 0 0 3px var(--sky)}
.pc textarea::placeholder{color:#B5B8CB}
.ref{font-size:12px;color:var(--mute);display:flex;align-items:center;gap:6px}
.ref .dt{width:6px;height:6px;border-radius:50%;background:var(--faint)}
.fbar{display:flex;align-items:center;gap:10px;justify-content:space-between}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--mute);cursor:pointer}
.toggle input{accent-color:var(--blue)}
.prelim-pc{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 14px 10px;font-size:12px;color:var(--mute)}
.prelim-pc div{background:var(--bg);border-radius:7px;padding:7px 9px}
.prelim-pc b{display:block;font-size:11px;color:var(--ink2);margin-bottom:2px}

/* ---------- Resultados ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpi{padding:12px 16px;display:flex;flex-direction:column;gap:2px}
.kpi span{font-size:12px;color:var(--mute);font-weight:500}
.kpi b{font-size:22px;font-weight:600;color:var(--ink);letter-spacing:-.01em;line-height:1.15}
.kpi b small{font-size:13px;color:var(--mute);font-weight:500}
.kpi em{font-style:normal;font-size:12px;color:var(--ink2)}
.res{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:14px;flex:1;min-height:0}
.hm-wrap{overflow:auto;padding:0}
.hm{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
.hm th{position:sticky;top:0;background:#fff;z-index:2;font-size:11px;font-weight:600;color:var(--ink2);padding:6px 3px;text-align:center;line-height:1.15;border-bottom:1px solid var(--line)}
.hm th.ax{font-size:12px;color:#fff;padding:7px}
.hm th.ax.cc{background:var(--amber);color:var(--ink)} .hm th.ax.cx{background:var(--blue)}
.hm thead tr:first-child th{top:0} .hm thead tr:nth-child(2) th{top:31px}
.hm th small{display:block;color:var(--faint);font-weight:600}
.hm td{padding:2px;text-align:center}
.hm td.s{text-align:left;padding:4px 8px;white-space:normal;min-width:150px;line-height:1.15;font-weight:500;font-size:13px}
.hm tr{cursor:pointer}
.hm tbody tr:hover td.s{color:var(--blue)}
.hm tr.on td.s{color:var(--blue);font-weight:600;box-shadow:inset 3px 0 0 var(--blue)}
.hm tr.on td{background:var(--sky2)}
.hc{height:30px;border-radius:6px;display:grid;place-items:center;font-weight:600;font-size:12px;position:relative;min-width:30px}
.hc.split::after{content:"";position:absolute;top:3px;right:3px;width:6px;height:6px;border-radius:50%;background:var(--red);box-shadow:0 0 0 1.5px #fff}
.hc.tot{font-size:14.5px;border:2px solid}
.hm .gap{width:8px}
.seg{display:inline-flex;background:var(--bg);border-radius:8px;padding:3px}
.seg button{padding:5px 11px;border-radius:6px;font-size:12.5px;font-weight:500;color:var(--mute)}
.seg button.on{background:#fff;color:var(--blue);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.det{display:flex;flex-direction:column;overflow:hidden}
.det .hd{padding:14px 16px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line2)}
.det .hd h3{margin:0;font-size:17px;font-weight:600;color:var(--blue);line-height:1.15}
.det .hd h3 small{display:block;font-size:12px;color:var(--mute);font-weight:400}
.det .bd{overflow:auto;padding:12px 16px;display:flex;flex-direction:column;gap:14px}
.dscore{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dscore div{border-radius:8px;padding:8px 12px}
.dscore .cc{background:var(--amber-l)} .dscore .cx{background:var(--sky2)}
.dscore span{font-size:11.5px;color:var(--ink2);font-weight:500}
.dscore b{display:block;font-size:24px;font-weight:600;line-height:1.1}
.dscore .cx b{color:var(--blue)}
.dscore em{font-style:normal;font-size:11.5px;color:var(--mute)}
.dist{display:flex;flex-direction:column;gap:5px}
.dist h6{margin:0 0 2px;font-size:12px;font-weight:700}
.drow{display:grid;grid-template-columns:118px 1fr 28px;gap:8px;align-items:center;font-size:12px}
.drow .tr{height:16px;position:relative;background:linear-gradient(90deg,var(--line2) 0,var(--line2) 100%) center/100% 2px no-repeat}
.drow .tr .m{position:absolute;top:2px;height:12px;width:3px;border-radius:2px;margin-left:-1.5px}
.drow .tr .e{position:absolute;top:4px;width:8px;height:8px;border-radius:50%;margin-left:-4px;opacity:.35}
.drow .tr .p{position:absolute;top:1px;width:2px;height:14px;margin-left:-1px;background:var(--ink);opacity:.25}
.drow b{text-align:right;font-weight:600}
.aport h6{margin:0 0 6px;font-size:12px;font-weight:700;display:flex;align-items:center;gap:6px}
.aport ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.aport li{font-size:13px;display:flex;gap:8px;align-items:flex-start;line-height:1.3}
.aport li .x{flex:none;font-size:11px;font-weight:600;padding:1px 6px;border-radius:999px;background:var(--bg);color:var(--ink2);margin-top:1px}
.aport li .x.k{background:var(--blue);color:#fff}
.aport .more{font-size:12px;color:var(--mute)}
.aport .themes{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.aport .themes span{font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--bg);color:var(--mute)}
.aport .src{font-size:11.5px;color:var(--faint);font-style:italic}
.part{display:flex;flex-wrap:wrap;gap:5px}
.part span{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--green-l);color:var(--green);font-weight:500}
.part span.dr{background:var(--bg);color:var(--mute)}

/* ---------- Dashboard ---------- */
.dash{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(0,1fr);gap:14px;flex:1;min-height:0}
.headline{display:flex;align-items:flex-start;gap:14px}
.headline h1{margin:0;font-size:23px;font-weight:500;color:var(--blue);line-height:1.2;letter-spacing:-.01em;max-width:900px}
.headline p{margin:4px 0 0;color:var(--ink2);font-size:13.5px;max-width:900px}
.sim-on{display:flex;align-items:center;gap:10px;padding:8px 14px;border-radius:8px;background:var(--amber-l);color:#7A5200;font-size:12.5px;font-weight:500}
.scat{display:flex;flex-direction:column;padding:12px 14px 8px;min-height:0}
.scat .bar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.scat .bar h3{margin:0;font-size:15px;font-weight:600}
.scat svg{flex:1;width:100%;min-height:0}
.lens{display:flex;flex-direction:column;min-height:0;overflow:hidden}
.lens .tabs{display:flex;gap:2px;padding:8px 10px 0;border-bottom:1px solid var(--line)}
.lens .tabs button{padding:8px 12px;font-size:13px;font-weight:500;color:var(--mute);border-bottom:2px solid transparent;margin-bottom:-1px}
.lens .tabs button.on{color:var(--blue);border-color:var(--blue)}
.lens .bd{flex:1;overflow:auto;padding:12px 16px;display:flex;flex-direction:column;gap:10px}
.rk{display:grid;grid-template-columns:22px 26px 1fr 130px 46px 44px;gap:8px;align-items:center;padding:3px 4px;border-radius:8px;cursor:pointer}
.rk:hover{background:var(--bg)}
.rk.on{background:var(--sky2)}
.rk .p{font-weight:600;color:var(--faint);font-size:12px;text-align:center}
.rk .n{font-size:13.5px;font-weight:500;line-height:1.15}
.rk .n small{display:block;font-size:11px;color:var(--mute);font-weight:400}
.dbar{display:flex;flex-direction:column;gap:3px}
.dbar div{height:6px;border-radius:999px;background:var(--line2);overflow:hidden}
.dbar i{display:block;height:100%;border-radius:999px}
.rk .t{font-weight:600;font-size:15px;text-align:right}
.delta{font-size:11.5px;font-weight:600;text-align:right}
.delta.up{color:var(--green)}.delta.dn{color:var(--red)}.delta.eq{color:var(--faint)}
.qtag{font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:999px;display:inline-block;margin-top:2px}
.q-pri{background:var(--sky);color:var(--blue)}.q-cx{background:#EEF0F6;color:var(--ink2)}.q-cc{background:var(--amber-l);color:var(--amber-d)}.q-low{background:var(--red-l);color:#9B1520}
.lensnote{font-size:12.5px;color:var(--mute);line-height:1.4}
.lensnote b{color:var(--ink)}
.simgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px}
.simgrid h6{margin:4px 0 2px;font-size:12px;font-weight:700}
.sl{display:grid;grid-template-columns:1fr 90px 32px;gap:6px;align-items:center;font-size:12px}
.sl input[type=range]{width:100%}
.cc .sl input{accent-color:var(--amber)} .cx .sl input{accent-color:var(--blue)}
.sl b{text-align:right;font-weight:600}
.rob{display:flex;flex-direction:column;gap:4px}
.rob .r{display:grid;grid-template-columns:150px 1fr 40px;gap:8px;align-items:center;font-size:12.5px}
.rob .r .tr{height:10px;background:var(--line2);border-radius:999px;overflow:hidden}
.rob .r .tr i{display:block;height:100%;background:var(--blue);border-radius:999px}
.rob .r b{text-align:right}
.plz{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pz{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;border-top:4px solid}
.pz h6{margin:0;font-size:13.5px;font-weight:600}
.pz .d{font-size:11.5px;color:var(--mute);margin-top:-4px}
.pz .s{display:flex;align-items:center;gap:7px;font-size:12.5px;padding:3px 4px;border-radius:6px;cursor:pointer}
.pz .s:hover{background:var(--bg)}
.pz .s .v{margin-left:auto;font-weight:600}
.pz .s.best{background:var(--sky2);font-weight:600}
.pz .rol{font-size:11.5px;font-weight:600;margin-top:auto;padding-top:4px}
.shortlist{display:flex;align-items:stretch;gap:10px}
.shortlist .lb{display:flex;flex-direction:column;justify-content:center;padding:0 6px;min-width:150px}
.shortlist .lb b{font-size:14px;color:var(--blue)}
.shortlist .lb span{font-size:12px;color:var(--mute)}
.sc-card{flex:1;padding:10px 14px;display:flex;align-items:center;gap:12px;border-left:4px solid var(--blue)}
.sc-card .t{flex:1}
.sc-card b{font-size:14px;display:block}
.sc-card span{font-size:12px;color:var(--mute)}
.sc-card .v{font-size:20px;font-weight:600;color:var(--blue)}
.insights{display:flex;flex-direction:column;gap:8px}
.ins{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.35;padding:8px 10px;border-radius:8px;background:var(--bg)}
.ins .k{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:700}
.tip{position:fixed;z-index:70;background:var(--ink);color:#fff;font-size:12px;padding:8px 10px;border-radius:8px;pointer-events:none;max-width:260px;line-height:1.35;box-shadow:0 8px 20px rgba(0,0,0,.2)}
.tip b{font-weight:600}
.menu{position:fixed;z-index:60;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 32px rgba(21,24,56,.18);min-width:250px;padding:6px}
.menu button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:8px 10px;border-radius:6px;font-size:13px}
.menu button:hover{background:var(--bg)}
.menu hr{border:0;border-top:1px solid var(--line2);margin:5px 0}
.menu .lbl{font-size:11.5px;color:var(--mute);padding:6px 10px 2px;font-weight:600}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;font-size:13.5px;z-index:90;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:tin .2s}
@keyframes tin{from{opacity:0;transform:translate(-50%,8px)}}
.modal-bg{position:fixed;inset:0;background:rgba(21,24,56,.35);z-index:80;display:grid;place-items:center}
.modal{background:#fff;border-radius:14px;width:460px;padding:24px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal h3{margin:0 0 8px;font-size:19px;font-weight:600;color:var(--blue)}
.modal p{margin:0 0 14px;color:var(--ink2);font-size:14px}
.modal .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.modal ul{margin:0;padding-left:18px;font-size:13px;color:var(--ink2)}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--mute);text-align:center;padding:30px;font-size:13.5px}

@keyframes pop{from{opacity:0;transform:scale(.3)}}

/* ---------- Navegación lateral (una sola navegación para todo) ---------- */
.nav{background:var(--white);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.nv-top{padding:18px 18px 14px;border-bottom:1px solid var(--line2)}
.nv-top .logo{height:16px;display:block;margin-bottom:12px}
.nv-top .ttl{font-weight:600;font-size:14.5px;color:var(--blue);line-height:1.2}
.nv-top .ttl small{display:block;font-weight:400;font-size:12px;color:var(--mute);margin-top:2px}
.nav-scroll{flex:1;overflow:auto;padding:10px 10px}
.nv-sec{margin-bottom:2px}
.nv-item{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:9px;text-align:left;font-weight:500;font-size:14px;color:var(--ink2)}
.nv-item:hover{background:var(--bg)}
.nv-item .n{width:24px;height:24px;border-radius:50%;border:1.5px solid #C9CDDD;display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--mute);flex:none}
.nv-item .t{flex:1}
.nv-item.on{background:var(--blue);color:#fff}
.nv-item.on .n{background:#fff;border-color:#fff;color:var(--blue)}
.nv-item .badge{font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--amber-l);color:var(--amber-d)}
.nv-item .badge.done{background:var(--green-l);color:var(--green)}
.nv-item.on .badge{background:rgba(255,255,255,.2);color:#fff}
.nv-kids{display:flex;flex-direction:column;gap:1px;margin:4px 0 8px 22px;padding-left:10px;border-left:1.5px solid var(--line)}
.nv-kid{text-align:left;padding:6px 10px;border-radius:7px;font-size:13px;color:var(--mute);font-weight:500}
.nv-kid:hover{background:var(--bg);color:var(--ink)}
.nv-kid.on{color:var(--blue);background:var(--sky2);font-weight:600}
.nv-kids.ev{margin-left:6px;padding-left:0;border-left:0}
.nv-grp{font-size:11px;color:var(--mute);font-weight:600;padding:8px 8px 3px}
.nv-ev{display:flex;align-items:center;gap:8px;width:100%;padding:5px 7px;border-radius:8px;text-align:left}
.nv-ev:hover{background:var(--bg)}
.nv-ev.on{background:var(--sky2);box-shadow:inset 3px 0 0 var(--blue)}
.nv-ev .nm{flex:1;font-size:12.5px;font-weight:500;line-height:1.15}
.nv-ev .nm small{display:block;font-size:11px;color:var(--mute);font-weight:400}
.nv-ev .num{min-width:22px;height:22px;font-size:10.5px}
.nv-send{padding:10px 14px 12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.nv-send .prog{margin:0}
.nv-send .btn{justify-content:center}
.nv-send .st{font-size:11.5px;color:var(--mute);text-align:center;line-height:1.3}
.nv-foot{padding:10px 12px 14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.nv-foot .who{width:100%;text-align:left}
.nv-foot .who .nm{max-width:none;flex:1}
.nv-foot .sync{padding-left:4px}
.nextb{color:var(--blue);border-color:#C8D3F5}
.nextb:hover{background:var(--sky2);border-color:var(--blue)}
.banner.slim{padding:8px 14px;font-size:12.5px}
/* Contexto: inicio */
.obj-grid .obj{padding:16px 18px;gap:8px}
.obj-grid .obj .top b{font-size:24px}
.obj-grid .obj .top .icw{width:38px;height:38px}
.obj-grid .obj h3{font-size:16.5px;margin-bottom:4px}
.obj-grid .obj p{font-size:13px}
.cad{padding:14px 18px 16px;gap:12px;flex:1;min-height:0;justify-content:space-between}
.cad-h{display:flex;align-items:baseline;gap:12px}
.cad-h b{font-size:16px;color:var(--blue);font-weight:600}
.cad-h span{font-size:13px;color:var(--ink2)}
.trans{grid-template-columns:auto repeat(4,1fr);align-items:center}
.trans .seclbl{background:none;padding:0;max-width:110px;line-height:1.2}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.duo .banner{font-size:13px}
/* Criterios en una página */
.ctab{overflow:hidden}
.ct-h{display:flex;align-items:center;gap:10px;padding:8px 14px;font-size:14.5px}
.ctab.cc .ct-h{background:var(--amber)} .ctab.cx .ct-h{background:var(--blue);color:#fff}
.ct-h .icw{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.9);display:grid;place-items:center;color:var(--blue)}
.ctab.cc .ct-h .icw{color:var(--amber-d)}
.ct-h b{font-weight:600}
.ct-sum{margin-left:auto;font-size:12.5px;font-weight:600;padding:2px 10px;border-radius:999px;background:rgba(255,255,255,.9)}
.ct-sum.ok{color:var(--green)} .ct-sum.bad{color:var(--red)}
.ct-row{display:grid;grid-template-columns:230px 150px 1fr 1fr 1fr;gap:0;align-items:center;border-bottom:1px solid var(--line2);font-size:12.5px;line-height:1.3}
.ct-row > span{padding:7px 12px}
.ct-row:last-child{border-bottom:0}
.ct-row .nm{font-weight:600;font-size:13px}
.ct-hd{font-size:11.5px;font-weight:700;color:var(--mute);background:#FAFBFD}
.ct-hd span{padding-top:6px;padding-bottom:6px}
.ct-row .a1{box-shadow:inset 3px 0 0 #F5A3A9}.ct-row .a3{box-shadow:inset 3px 0 0 #C9CDDD}.ct-row .a5{box-shadow:inset 3px 0 0 var(--green)}
.ct-hd .a1{color:#C21B27}.ct-hd .a5{color:var(--green)}
.pw{display:flex;align-items:center;gap:6px}
.pw .wbar{flex:1}
.pw b{font-weight:600;width:34px;text-align:right}
.ctab.cc .wbar i{background:var(--amber)} .ctab.cx .wbar i{background:var(--blue)}
.pw .st{width:24px;height:24px;border-radius:6px;border:1px solid var(--line);display:grid;place-items:center;font-size:14px;line-height:1}
.pw .st:hover{border-color:var(--blue);color:var(--blue)}
.pw input{-moz-appearance:textfield;width:44px;text-align:center;border:1px solid var(--line);border-radius:6px;padding:3px;font-weight:600}
.pw input::-webkit-outer-spin-button,.pw input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.formula{padding:8px;font-size:14px}
/* Evaluación a todo el ancho */
.view.ev-main{gap:10px;padding:14px 20px}
.ev-main .fhd h1{font-size:22px}
.ev-main .fbox{padding:10px 14px;font-size:13px}
.pc{padding:8px 14px 10px}
.pc textarea{min-height:58px}

.crit-meta{display:flex;gap:10px;align-items:stretch}
.crit-meta .formula{flex:none;display:flex;align-items:center;padding:6px 16px;font-size:13.5px}
.crit-meta .admin-bar,.crit-meta .banner{flex:1;padding:6px 12px}
.ct-row > span{padding:5px 12px}
.ct-h{padding:6px 14px}
.nv-foot{padding:8px 10px 10px}
.nv-foot .who{border-radius:12px;padding:6px 8px;align-items:flex-start}
.nv-foot .sync{font-size:11px;margin-top:3px}
.nv-ev{padding:3px 7px}
.nv-grp{padding:6px 8px 2px}
.nv-top{padding:14px 18px 10px}
.nv-top .logo{margin-bottom:8px}

.sendbox{display:flex;align-items:center;gap:8px;margin-left:10px;padding-left:12px;border-left:1px solid var(--line)}
.sendbox .sp{width:70px;height:6px;border-radius:999px;background:var(--line2);overflow:hidden}
.sendbox .sp i{display:block;height:100%;background:var(--green)}
.sendbox .st{font-size:12px;color:var(--mute);white-space:nowrap}
.fhd h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.fhd .tags{flex:none}

.ev-main .sides{flex:1;min-height:0}
.ev-main .side .pc{flex:1;min-height:0}

const W = () => S.simW || S.cfg.weights;
function axisScore(vals, ax, w=W()){ // vals: {critId: 1..5}
  let s=0, ws=0, n=0;
  for(const c of CRIT[ax]){ const v=vals[c.id]; if(v){ s+=v*w[ax][c.id]; ws+=w[ax][c.id]; n++; } }
  if(!n || !ws) return null;
  return s/ws*20; // escala 0–100 (con pesos que suman 100: Σ cal×peso ×20)
}
const prelimVals = (id, ax) => Object.fromEntries(CRIT[ax].map((c,i)=>[c.id, SCH[id].p[ax][i]]));

/* Agregado por esquema con los pesos vigentes (o simulados) */
function aggregate(w=W()){
  const subs = submitted();
  const out = {};
  for(const s of SCHEMES){
    const r = {id:s.id, n:0, mean:{cc:{},cx:{}}, sdv:{cc:{},cx:{}}, raw:{cc:{},cx:{}}, ind:[], src:"prelim"};
    const all = subs.map(e=>e.fichas[s.id]).filter(f=>f && fichaStatus(f, s.id).scores===14);
    r.votes = Object.fromEntries(CLI().map(c=>[c.k,0]));
    all.forEach(f=>(f.clientes||[]).forEach(k=>{ if(k in r.votes) r.votes[k]++; }));
    const vmax = Math.max(0,...Object.values(r.votes));
    r.cli = s.tipo!=="prop" ? null : vmax ? Object.keys(r.votes).find(k=>r.votes[k]===vmax) : s.natural;
    r.nAll = all.length;
    const fs = (S.cliente && S.cliente!=="all" && s.tipo==="prop") ? all.filter(f=>(f.clientes||[]).includes(S.cliente)) : all;
    r.n = fs.length;
    for(const ax of ["cc","cx"]) for(const c of CRIT[ax]){
      const arr = fs.map(f=>f[ax][c.id]).filter(Boolean);
      r.raw[ax][c.id] = arr;
      r.mean[ax][c.id] = arr.length ? mean(arr) : SCH[s.id].p[ax][CRIT[ax].indexOf(c)];
      r.sdv[ax][c.id] = sd(arr);
    }
    if(r.n) r.src = "eval";
    r.cc = axisScore(r.mean.cc,"cc",w); r.cx = axisScore(r.mean.cx,"cx",w);
    r.pcc = axisScore(prelimVals(s.id,"cc"),"cc",w); r.pcx = axisScore(prelimVals(s.id,"cx"),"cx",w);
    r.ind = fs.map(f=>({cc:axisScore(f.cc,"cc",w), cx:axisScore(f.cx,"cx",w)}));
    r.comb = (r.cc+r.cx)/2; r.pcomb = (r.pcc+r.pcx)/2;
    r.disp = r.ind.length>1 ? sd(r.ind.map(x=>(x.cc+x.cx)/2)) : 0;
    r.dispAx = {cc: r.ind.length>1 ? sd(r.ind.map(x=>x.cc)) : 0, cx: r.ind.length>1 ? sd(r.ind.map(x=>x.cx)) : 0};
    r.q = quadrant(r.cc, r.cx);
    out[s.id] = r;
  }
  return out;
}
/* Umbrales (presentación 24 oct): Priorizar = ambos ejes ≥ 70; Explorar = ambos ≥ 60; el resto, Rediseñar */
const TH = 60, TH2 = 70;
function quadrant(x,y){
  if(x>=TH2 && y>=TH2) return {k:"pri", t:"Priorizar"};
  if(x>=TH && y>=TH) return {k:"exp", t:"Explorar"};
  if(y>=TH) return {k:"cx", t:"Rediseñar: difícil de vender al concretero"};
  if(x>=TH) return {k:"cc", t:"Rediseñar: atractivo solo para el concretero"};
  return {k:"low", t:"Rediseñar"};
}
function ranked(agg, key="comb"){ return S.cfg.order.map(id=>agg[id]).sort((a,b)=>b[key]-a[key]); }

/* Robustez: % de escenarios de pesos (±50% aleatorio por criterio) en que cada esquema queda en el top 3 */
function robustness(N=400){
  const base = W(); const agg = aggregate(base);
  const cnt = Object.fromEntries(SCHEMES.map(s=>[s.id,0]));
  let seed = 7; const rnd = () => (seed = (seed*16807)%2147483647)/2147483647;
  for(let k=0;k<N;k++){
    const w = {cc:{},cx:{}};
    for(const ax of ["cc","cx"]){ let t=0; for(const c of CRIT[ax]){ w[ax][c.id]=base[ax][c.id]*(0.5+rnd()); t+=w[ax][c.id]; } for(const c of CRIT[ax]) w[ax][c.id]=w[ax][c.id]/t*100; }
    const sc = SCHEMES.map(s=>({id:s.id, v:(axisScore(agg[s.id].mean.cc,"cc",w)+axisScore(agg[s.id].mean.cx,"cx",w))/2})).sort((a,b)=>b.v-a.v);
    sc.slice(0,3).forEach(x=>cnt[x.id]++);
  }
  return Object.fromEntries(Object.entries(cnt).map(([k,v])=>[k, v/N]));
}

const stem = w => w.length>5 ? w.slice(0,5) : w;
const toks = t => [...new Set(norm(t).replace(/[^a-z0-9ñ ]/g," ").split(" ").filter(w=>w.length>2 && !STOP.has(w)).map(stem))];
function summarize(items){ // items: [{t, who}]
  const xs = items.map(x=>({...x, k:toks(x.t)})).filter(x=>x.t);
  const sim = (a,b) => { if(!a.k.length||!b.k.length) return 0; const s=new Set(b.k); const i=a.k.filter(w=>s.has(w)).length; const m=Math.min(a.k.length,b.k.length); if(!i) return 0; if(i===1 && m>2) return .34; return i/m; };
  const cl = [];
  for(const x of xs){
    let best=null, bv=0;
    for(const c of cl){ const v = Math.max(...c.items.map(y=>sim(x,y))); if(v>bv){bv=v;best=c;} }
    if(best && bv>=0.5) best.items.push(x); else cl.push({items:[x]});
  }
  for(const c of cl){
    c.who = new Set(c.items.map(i=>i.who)).size;
    // representativa: la más parecida al resto; desempate, la más corta
    c.rep = c.items.map(a=>({a, s:c.items.reduce((t,b)=>t+(a===b?0:sim(a,b)),0)})).sort((p,q)=>q.s-p.s || p.a.t.length-q.a.t.length)[0].a.t;
  }
  cl.sort((a,b)=>b.who-a.who || b.items.length-a.items.length);
  // temas: raíces más frecuentes entre evaluadores
  const tf = {}, word = {};
  for(const x of xs) for(const k of x.k){ (tf[k] ||= new Set()).add(x.who); }
  for(const x of xs) norm(x.t).replace(/[^a-z0-9ñ ]/g," ").split(" ").forEach(w=>{ const k=stem(w); if(tf[k]){ (word[k] ||= {}); word[k][w]=(word[k][w]||0)+1; } });
  const themes = Object.entries(tf).filter(([k,v])=>v.size>1).sort((a,b)=>b[1].size-a[1].size).slice(0,5).map(([k])=>Object.entries(word[k]).sort((a,b)=>b[1]-a[1])[0][0]);
  return {clusters:cl, themes, total:xs.length};
}
function commentsFor(id){
  const out = {cc_pro:[],cc_con:[],cx_pro:[],cx_con:[],notas:[]};
  for(const e of submitted()){ const f=e.fichas[id]; if(!f) continue;
    for(const k of ["cc_pro","cc_con","cx_pro","cx_con"]) lines(f[k]).forEach(t=>out[k].push({t, who:e.evaluador}));
    for(const [k,v] of Object.entries(f.notas||{})) if(v && v.trim()) out.notas.push({t:v.trim(), who:e.evaluador, c:k});
  }
  return out;
}

function setSync(state, msg=""){ S.sync = {state, at: state==="ok"?new Date().toISOString():S.sync.at, msg}; renderSync(); }
async function pull(silent){
  try{
    const d = await Store.load();
    if(d.config && (d.config.rev||0) >= (S.cfg.rev||0)) S.cfg = Object.assign(defaultConfig(), d.config);
    for(const [k,v] of Object.entries(d.evaluaciones||{})){
      if(S.user && norm(k)===norm(S.user)){
        if(!S.my || (!S.dirty && (v.updatedAt||"") >= (S.my.updatedAt||""))) S.my = v;
        S.evals[S.user] = S.my;
      } else S.evals[k] = v;
    }
    setSync(Store.remoto ? "ok" : "local");
    if(!silent) render(); else softRender();
  }catch(e){ setSync("err", e.message); }
}
let saveT = null;
function queueSave(){
  S.dirty = true; S.my.updatedAt = new Date().toISOString(); S.evals[S.user] = S.my;
  setSync("saving");
  clearTimeout(saveT);
  saveT = setTimeout(async ()=>{
    try{ await Store.saveEval(S.my); S.dirty=false; setSync(Store.remoto?"ok":"local"); }
    catch(e){ setSync("err", e.message); try{ localStorage.setItem(LK+"pendiente", JSON.stringify(S.my)); }catch(_){} }
  }, 700);
}
async function saveConfig(msg){
  S.cfg.rev = (S.cfg.rev||0)+1; S.cfg.updatedBy = S.user; S.cfg.updatedAt = new Date().toISOString();
  setSync("saving");
  try{ await Store.saveConfig(S.cfg); setSync(Store.remoto?"ok":"local"); if(msg) toast(msg); }
  catch(e){ setSync("err", e.message); toast("No se guardó el cambio: "+e.message); }
}

/* ---------- Ajuste automático al tamaño de pantalla ----------
   Todas las vistas se diseñan sobre un lienzo de referencia y se escalan
   para que quepan completas en cualquier monitor, sin zoom manual. */
const REF = {w:1480, h:840};
let Z = 1;
function fit(){
  const app = $("#app"); if(!app) return;
  Z = Math.max(.55, Math.min(1.35, innerWidth/REF.w, innerHeight/REF.h));
  app.style.transform = `scale(${Z})`;
  app.style.width = (innerWidth/Z)+"px";
  app.style.height = (innerHeight/Z)+"px";
  document.documentElement.style.setProperty("--z", Z);
}
/* coloca un elemento flotante (fuera del lienzo) con la misma escala */
function place(el, x, y){
  el.style.transform = `scale(${Z})`; el.style.transformOrigin = "0 0";
  const w = el.offsetWidth*Z, h = el.offsetHeight*Z;
  if(x+w > innerWidth-6) x = innerWidth-w-6;
  if(y+h > innerHeight-6) y = Math.max(6, innerHeight-h-6);
  el.style.left = Math.max(6,x)+"px"; el.style.top = y+"px";
}

function renderSync(){
  const el = $("#sync"); if(!el) return;
  const st = S.sync.state;
  if(st==="saving"){ el.className="sync"; el.innerHTML=`<i style="background:var(--azure)"></i>Guardando…`; }
  else if(st==="err"){ el.className="sync err"; el.innerHTML=`<i></i>Sin conexión`; el.title=S.sync.msg; }
  else if(!Store.remoto){ el.className="sync local"; el.innerHTML=`<i></i>Guardado en este equipo`; el.title="Modo local: los cambios se guardan solo en este navegador. En Datacreto se comparten con todos."; }
  else { el.className="sync"; el.innerHTML=`<i></i>Sincronizado ${S.sync.at?ago(S.sync.at):""}`; el.title=""; }
}
function renderMain(){
  const m = $("#main");
  const f = {contexto:viewContexto, criterios:viewCriterios, evaluacion:viewEvaluacion, resultados:viewResultados, dashboard:viewDashboard}[S.sec];
  m.innerHTML = f();
  afterRender();
}
let afterFns = [];
function afterRender(){ const fs=afterFns; afterFns=[]; fs.forEach(f=>f()); }

async function login(n){
  S.user = n; S.admin = isAdminName(n);
  localStorage.setItem(ME_KEY, n);
  const k = Object.keys(S.evals).find(x=>norm(x)===norm(n));
  S.my = k ? S.evals[k] : blankEval(n);
  if(k && k!==n){ delete S.evals[k]; }
  S.evals[n] = S.my;
  render();
  pull(true);
}

    </div>

      <div class="banner"><b>La filial no desaparece:</b> cambia de rol según la plaza y convive con los esquemas de colaboración.</div>
      <div class="banner blue"><b>Target</b> Buscar el esquema en el que CEMEX conserve los bloques donde es fuerte y comparta con terceros los que más capital y costo consumen.</div>

}
function numB(id, lg){ const s=SCH[id]; return `<span class="num ${s.tipo==="actual"?"act":""} ${lg?"lg":""}">${id}</span>`; }
function cellClass(v){ const n=norm(v); if(n==="tercero") return "ter"; if((n.startsWith("cx")||n.startsWith("jv")) && !n.includes(" o ")) return "cx"; return "mix"; }
function cellHTML(v){
  const s = String(v||"");
  let a=s, b="";
  if(s.includes(" · ")){ [a,b]=s.split(" · "); }
  else if(s.includes(" + ")){ const i=s.indexOf(" + "); a=s.slice(0,i); b="+ "+s.slice(i+3); }
  return `${esc(a)}${b?`<small>${esc(b)}</small>`:""}`;
}
function viewMatriz(){
  const ord = S.cfg.order, sel = S.mxSel, pos = ord.indexOf(sel);
  const ed = S.admin;
  const g = (r,c,html,cls="",extra="") => `<div class="${cls}" style="grid-row:${r};grid-column:${c}" ${extra}>${html}</div>`;
  const colOf = j => j<5 ? 3+j : 4+j;   // columna 8 = separador
  let h = g(1,"3 / span 5","Cadena de valor","gh c") + g(1,"9 / span 4","Transversales","gh t");
  COLS.forEach((c,j)=>{ h += g(2,colOf(j),c.label,"ch "+(c.grp==="cadena"?"c":"t")); });
  h += g(3,2,"Oferta de valor de CEMEX","of-l");
  COLS.forEach((c,j)=>{ h += g(3,colOf(j),OFERTA_COL[c.id]||"—","of"); });
  // bandas de grupo (tramos contiguos en el orden actual)
  let i=0;
  while(i<ord.length){
    const gr = SCH[ord[i]].grupo; let j=i; while(j+1<ord.length && SCH[ord[j+1]].grupo===gr) j++;
    if(gr) h += g(`${4+i} / span ${j-i+1}`,1,`<span>${GRUPOS[gr].t}</span>`,"band-g",`title="${GRUPOS[gr].t}" data-g="${gr}"`);
    i=j+1;
  }
  ord.forEach((id,r)=>{
    const s = SCH[id], on = id===sel ? "row-sel" : "", R = 4+r;
    h += g(R,2,`${numB(id)}<span>${esc(s.name)}</span>`,`rh ${s.tipo==="actual"?"act":""} ${on}`,`data-row="${id}"`);
    COLS.forEach((c,j)=>{ const v=S.cfg.cells[id][c.id]; h += g(R,colOf(j),cellHTML(v),`cell ${cellClass(v)} ${on}`,`data-cell="${id}|${c.id}" title="${esc(v)}"`); });
    h += g(R,13,`<button class="fl" data-ficha="${id}" title="Abrir ficha de ${esc(s.name)}">${ic("right",15,2.2)}</button>`,"flc");
  });
  h += g(`1 / span ${3+ord.length}`,8,"","sep");
  return `<div class="view">
    <div class="vh"><div><h1>Matriz de esquemas</h1><p>Nueve esquemas propuestos, ordenados de mayor a menor fidelidad del tercero, y quién opera cada bloque de la cadena</p></div>
      <div class="tools">${ed ? `<div class="mx-tools">
        <span class="note">${sel?esc(SCH[sel].name):"Selecciona una fila"}</span>
        <button class="arrowbtn" data-mv="-1" ${!sel||pos<=0?"disabled":""} title="Subir fila">${ic("up")}</button>
        <button class="arrowbtn" data-mv="1" ${!sel||pos<0||pos>=ord.length-1?"disabled":""} title="Bajar fila">${ic("down")}</button>
        <button class="btn sm ghost" data-act="resetMx">${ic("reset",14)} Restablecer</button></div>` : ""}${nextBtn()}</div></div>
    ${ed ? `<div class="admin-bar">${ic("edit",15)}<span><b>Modo administrador.</b> Doble clic en una celda para cambiarla. Selecciona una fila y usa las flechas para moverla con todas sus columnas.</span></div>`
         : `<div class="banner slim">${ic("lock",15)}<span>Solo ${esc(ADMINS[0])} puede cambiar el orden y las celdas.${S.cfg.updatedAt?` Último cambio: ${esc(S.cfg.updatedBy)}, ${fmtTime(S.cfg.updatedAt)}.`:""}</span></div>`}
    <div class="panel" style="padding:12px 14px;display:flex;gap:8px;flex:1;min-height:0;overflow:auto">
      <div class="axis-v">Mayor fidelidad ${ic("down",16,2.2)}</div>
      <div class="mx ${ed?"editable":""}" style="flex:1">${h}</div>
    </div>
    <div class="legend"><span><i class="cx"></i>CEMEX opera</span><span><i class="mix"></i>Tercero opera con una oferta de CEMEX</span><span><i class="ter"></i>Tercero opera solo</span>
      <span style="margin-left:auto">Las fichas de evaluación toman la cadena de valor de esta matriz. La flecha de cada fila abre su ficha.</span></div>
  </div>`;
}

/* Popover de celda */
function closePop(){ $$(".pop,.menu").forEach(p=>p.remove()); }
function openCellPop(el){
  closePop();
  const [id,col] = el.dataset.cell.split("|");
  const cur = S.cfg.cells[id][col];
  const opts = [...new Set([...OPCIONES_CELDA, ...Object.values(S.cfg.cells).map(r=>r[col])])];
  const p = document.createElement("div"); p.className="pop";
  p.innerHTML = `<h4>${esc(SCH[id].name)}: ${esc(COLS.find(c=>c.id===col).label)}</h4>
    <div class="opts">${opts.map(o=>`<button class="opt ${o===cur?"on":""}" data-v="${esc(o)}"><i class="${cellClass(o)}" style="${cellClass(o)==="cx"?"background:var(--azure);border-color:var(--azure)":cellClass(o)==="mix"?"background:var(--sky);border-color:#9CC5F6":"border-color:#CDD1DE"}"></i>${esc(o)}</button>`).join("")}</div>
    <div class="other"><input class="inp" placeholder="Otro: escribe el texto" id="popOther"><button class="btn sm pri" id="popOk">Usar</button></div>`;
  document.body.appendChild(p);
  const r = el.getBoundingClientRect();
  place(p, r.left, r.bottom+6);
  if(r.bottom+6+p.offsetHeight*Z > innerHeight) place(p, r.left, r.top - p.offsetHeight*Z - 6);
  const apply = v => { v=String(v||"").trim(); if(!v) return; S.cfg.cells[id][col]=v; closePop(); renderMain(); saveConfig("Celda actualizada"); flash(`[data-cell="${id}|${col}"]`); };
  p.querySelectorAll(".opt").forEach(b=>b.onclick=()=>apply(b.dataset.v));
  $("#popOk").onclick=()=>apply($("#popOther").value);
  $("#popOther").onkeydown=e=>{ if(e.key==="Enter") apply(e.target.value); if(e.key==="Escape") closePop(); };
}

function ringSVG(n, total, done){
  const r=9, c=2*Math.PI*r, f=total?n/total:0;

    ${done?`<circle cx="11" cy="11" r="${r+1.5}" fill="var(--green)"/><path d="M7 11.3l2.7 2.7 5-5.4" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`
    :`<circle cx="11" cy="11" r="${r}" fill="none" stroke="var(--azure)" stroke-width="3" stroke-dasharray="${c*f} ${c}" transform="rotate(-90 11 11)" stroke-linecap="round"/>`}</svg>`;
}
function anchorText(c, v){
  if(!v) return "";

  if(v===3) return `<b>3</b> ${esc(c.a[1])}`;

            ${COLS.map((c,j)=>{ const v=S.cfg.cells[id][c.id]; return (j===5?`<div></div>`:"")+`<div class="cell ${cellClass(v)}" title="${esc(v)}">${cellHTML(v)}</div>`; }).join("")}</div>
        </div>
      </div>
      ${cliPicker(f, id)}

        <span class="ref">${st.done?`<span style="color:var(--green);font-weight:600">${ic("check",15)} Ficha completa</span>`:needsCli(id)?`Elige el tipo de cliente, califica los 14 criterios y escribe al menos un comentario por lado.`:`Califica los 14 criterios y escribe al menos un comentario por lado (opcional en modelos actuales).`}</span>
        <span style="display:flex;gap:14px;align-items:center">

/* ============================================================
   4 · RESULTADOS
   ============================================================ */
const STOPS = [[1,[242,150,157]],[2,[249,205,208]],[3,[238,240,246]],[4,[160,190,245]],[5,[47,98,222]]];
function heat(v){
  if(v==null) return {bg:"#F4F5F9", fg:"var(--faint)"};
  v = Math.max(1,Math.min(5,v));
  let a=STOPS[0], b=STOPS[4];
  for(let i=0;i<4;i++) if(v>=STOPS[i][0] && v<=STOPS[i+1][0]){ a=STOPS[i]; b=STOPS[i+1]; break; }
  const t=(v-a[0])/((b[0]-a[0])||1); const c=a[1].map((x,i)=>Math.round(x+(b[1][i]-x)*t));
  return {bg:`rgb(${c})`, fg: v>4.3?"#fff":"var(--ink)"};
}
function heatD(d){ // diferencia vs preliminar
  if(d==null || Math.abs(d)<0.05) return {bg:"#F4F5F9", fg:"var(--faint)"};
  const t=Math.min(1,Math.abs(d)/2);
  return d>0 ? {bg:`rgba(14,159,110,${.12+.5*t})`, fg:"var(--ink)"} : {bg:`rgba(242,34,48,${.1+.45*t})`, fg:"var(--ink)"};
}
function cliFilter(){
  const opts = [["all","Todos los clientes"], ...CLI().filter(c=>c.k!=="n").map(c=>[c.k, c.t.split(" ")[0]])];
  return `<div class="seg cf" title="Muestra el eje del concretero solo con las evaluaciones hechas para ese tipo de cliente">${opts.map(o=>`<button class="${S.cliente===o[0]?"on":""}" data-cf="${o[0]}">${esc(o[1])}</button>`).join("")}</div>`;
}
function cliChips(r){
  if(!r.cli) return `<span class="cl-ref">Ref.</span>`;
  const tot = Object.values(r.votes).reduce((a,b)=>a+b,0);
  if(!tot) return `<span class="cl-ch nat" title="Cliente natural de la ficha (sin evaluaciones aún)">${cliLetter(r.cli)}</span>`;
  return Object.entries(r.votes).filter(([k,v])=>v).sort((a,b)=>b[1]-a[1]).map(([k,v],i)=>`<span class="cl-ch ${i===0?"top":""} ${k==="n"?"none":""}" title="${esc(cliName(k))}: ${v} evaluador${v>1?"es":""}">${cliLetter(k)}<i>${v}</i></span>`).join("");
}
function cliBanner(){
  if(S.cliente==="all") return "";
  return `<div class="sim-on" style="background:var(--sky2);color:var(--blue)">${ic("users",15)} Viendo el eje del concretero solo con evaluaciones hechas para el cliente <b>&nbsp;${esc(cliName(S.cliente))}</b>. Los esquemas sin evaluaciones para ese cliente muestran la preliminar.<button class="btn sm" style="margin-left:auto" data-cf="all">Ver todos</button></div>`;

function viewResultados(){
  const agg = aggregate(S.cfg.weights);

  if(!S.resSel) S.resSel = ranked(agg)[0].id;
  const top = ranked(agg)[0];

  };

      + (()=>{ const t=totVal(r,ax); return `<td><div class="hc tot" style="background:${t.h.bg};color:${t.h.fg};border-color:${t.b}">${t.txt}</div></td>`; })();

  }).join("");
  return `<div class="view">
    <div class="vh"><div><h1>Resultados</h1><p>${n?`Promedio de ${n} evaluaci${n>1?"ones enviadas":"ón enviada"}, con los pesos vigentes`:"Aún no hay evaluaciones enviadas: se muestra la calificación preliminar como punto de partida"}</p></div>
      <div class="tools">
        ${cliFilter()}
        <div class="seg">${[["evaluado","Promedio"],["prelim","Preliminar"],["cambio","Cambio vs preliminar"]].map(x=>`<button class="${mode===x[0]?"on":""}" data-rmode="${x[0]}">${x[1]}</button>`).join("")}</div>
        <div class="seg">${[["orden","Orden de la matriz"],["puntaje","Por puntaje"]].map(x=>`<button class="${sortBy===x[0]?"on":""}" data-rsort="${x[0]}">${x[1]}</button>`).join("")}</div>
      </div></div>
    ${cliBanner()}
    <div class="kpis">
      <div class="panel kpi"><span>Evaluaciones enviadas</span><b>${n}${expected?` <small>de ${expected}</small>`:""}</b><em>${drafts.length?`${drafts.length} en borrador`:"Sin borradores pendientes"}</em></div>
      <div class="panel kpi"><span>Mejor calificado</span><b>${esc(top.id)} ${esc(SCH[top.id].name)}</b><em>${Math.round(top.cc)} concretero · ${Math.round(top.cx)} CEMEX</em></div>
      <div class="panel kpi"><span>Mayor consenso</span><b>${cons?esc(SCH[cons.id].name):"–"}</b><em>${cons?`Los evaluadores difieren ±${Math.round(cons.disp)} pts`:"Se necesitan 2 evaluaciones"}</em></div>
      <div class="panel kpi"><span>Mayor división</span><b>${div?esc(SCH[div.id].name):"–"}</b><em>${div?`Los evaluadores difieren ±${Math.round(div.disp)} pts`:"Se necesitan 2 evaluaciones"}</em></div>
    </div>
    <div class="res">
      <div class="panel hm-wrap"><table class="hm">
        <thead><tr><th></th><th></th><th class="ax cc" colspan="8">Atractivo para el concretero</th><th class="gap"></th><th class="ax cx" colspan="8">Atractivo para CEMEX</th><th></th></tr>

function detailPanel(r){
  const s = SCH[r.id], cm = commentsFor(r.id);

    ${CRIT[ax].map((c,i)=>{ const raw=r.raw[ax][c.id], m=r.mean[ax][c.id], pv=s.p[ax][i], X=v=>((v-1)/4*100);
      const cnt={}; raw.forEach(v=>cnt[v]=(cnt[v]||0)+1);
      return `<div class="drow"><span>${c.short}</span><span class="tr">
        <span class="p" style="left:${X(pv)}%" title="Preliminar: ${pv}"></span>
        ${Object.entries(cnt).map(([v,k])=>`<span class="e" style="left:${X(+v)}%;background:${ax==="cc"?"var(--amber)":"var(--blue)"};transform:scale(${1+Math.min(1.2,(k-1)*.35)})" title="${k} evaluador${k>1?"es":""} calificó ${v}"></span>`).join("")}
        <span class="m" style="left:${X(m)}%;background:${ax==="cc"?"var(--amber-d)":"var(--blue)"}"></span></span><b>${r.n?round(m,1).toFixed(1):pv}</b></div>`; }).join("")}</div>`;
  const box = (key, label, color, ax) => {

      ${sm.clusters.length>4?`<div class="more">${sm.clusters.length-4} ideas más con una sola mención</div>`:""}
      ${sm.themes.length?`<div class="themes">${sm.themes.map(t=>`<span>${esc(t)}</span>`).join("")}</div>`:""}</div>`;
  };
  const notes = cm.notas;
  const part = Object.values(S.evals).filter(e=>e && Object.entries(e.fichas||{}).some(([k,f])=>fichaStatus(f,k).n>0));
  return `<div class="panel det">
    <div class="hd">${numB(r.id,true)}<h3>${esc(s.name)}<small>${s.tag}: ${esc(s.sub)}</small></h3>
      <button class="btn sm ghost" style="margin-left:auto" data-ficha="${r.id}">Ver ficha</button></div>
    <div class="bd">
      <div class="dscore">
        <div class="cc"><span>Para el concretero</span><b>${Math.round(r.cc)}<small style="font-size:13px;color:var(--mute)"> /100</small></b><em>Preliminar ${Math.round(r.pcc)}${r.n?` (${dTxt(r.cc-r.pcc)})`:""}</em></div>
        <div class="cx"><span>Para CEMEX</span><b>${Math.round(r.cx)}<small style="font-size:13px;color:var(--mute)"> /100</small></b><em>Preliminar ${Math.round(r.pcx)}${r.n?` (${dTxt(r.cx-r.pcx)})`:""}</em></div>
      </div>
      ${r.cli?`<div class="cvotes"><span class="seclbl">Para qué cliente lo ven los evaluadores</span>${(()=>{ const tot=Object.values(r.votes).reduce((a,b)=>a+b,0); return CLI().map(c=>{ const v=r.votes[c.k]||0; return `<div class="cv"><span>${esc(c.t)}${SCH[r.id].natural===c.k?` <em>natural</em>`:""}</span><span class="tr"><i style="width:${tot?v/r.nAll*100:0}%"></i></span><b>${v}</b></div>`; }).join(""); })()}</div>`:`<div class="note">Modelo actual: no se califica por tipo de cliente.</div>`}
      <div class="note" style="margin-top:-6px">${r.n?`${r.n} evaluaci${r.n>1?"ones":"ón"}. Cuadrante: <b style="color:var(--blue)">${r.q.t}</b>`:"Sin evaluaciones enviadas para este esquema"}</div>
      ${dist("cc")}${dist("cx")}
      <div class="legend" style="font-size:11.5px;gap:12px"><span><i style="width:3px;height:12px;border-radius:2px;background:var(--blue);border:0"></i>Promedio</span><span><i style="width:8px;height:8px;border-radius:50%;background:var(--blue);opacity:.4;border:0"></i>Evaluadores</span><span><i style="width:2px;height:12px;background:var(--ink);opacity:.3;border:0"></i>Preliminar</span></div>

    </div></div>`;

  const rob = robustness();
  if(!S.dashSel) S.dashSel = rk[0].id;
  // titular
  const a = props[0], b = props[1];
  const both = a.q.k==="pri" && b.q.k==="pri";
  const expl = props.filter(r=>r.q.k==="exp");
  const head = `${SCH[a.id].name} y ${SCH[b.id].name} lideran ${n?"la evaluación":"la calificación preliminar"}${both?": atractivos para ambas partes":""}`;
  const moves = n ? props.filter(r=>r.n).map(r=>({r, d:r.comb-r.pcomb})).sort((x,y)=>Math.abs(y.d)-Math.abs(x.d)) : [];
  const gapS = props.slice().sort((x,y)=>Math.abs(y.cc-y.cx)-Math.abs(x.cc-x.cx))[0];

    `${SCH[gapS.id].name} tiene la mayor brecha entre ejes: ${Math.round(gapS.cc)} para el concretero contra ${Math.round(gapS.cx)} para CEMEX.`

    <div class="headline"><div style="flex:1"><h1>${esc(head)}</h1><p>${esc(sub)}</p></div>

    ${n?"":`<div class="banner" style="padding:8px 14px;font-size:12.5px">${ic("info",15)}<span>Sin evaluaciones enviadas todavía: el análisis usa la calificación preliminar y se actualiza con cada envío.</span></div>`}
    <div class="dash">
      <div class="panel scat"><div class="bar"><h3>Matriz de evaluación</h3>
        <span class="legend" style="font-size:11.5px;gap:12px;margin-left:auto;margin-right:14px"><span><i style="width:11px;height:11px;border-radius:50%;background:var(--amber);border:0"></i>Propuesto</span><span><i style="width:11px;height:11px;border-radius:50%;background:#8A8FA8;border:0"></i>Modelo actual</span><span><i style="width:15px;height:15px;border-radius:50%;background:var(--amber);opacity:.3;border:0"></i>Halo = desacuerdo</span></span><label class="toggle"><input type="checkbox" data-act="toggleGhost" ${S.ghost!==false?"checked":""}> Posición preliminar</label></div>
        <div id="scatHost" style="flex:1;min-height:0;position:relative"></div></div>
      <div class="panel lens">

      ${short.length?short.map(r=>`<button class="panel sc-card" data-dsel="${r.id}" style="text-align:left">${numB(r.id)}<span class="t"><b>${esc(SCH[r.id].name)}</b><span>Top 3 en ${Math.round(rob[r.id]*100)}% de los escenarios de pesos · ${r.n>1?(r.disp<7?"alto consenso":"equipo dividido"):"sin medir consenso"}</span></span><span class="v">${Math.round(r.comb)}</span></button>`).join("")

function lensConsenso(agg){
  const rs = Object.values(agg).filter(r=>r.n>=2);
  if(!rs.length) return `<div class="empty">${ic("users",28)}<b>Se necesitan al menos 2 evaluaciones enviadas</b>El consenso mide qué tanto difieren los evaluadores en el puntaje de cada esquema.</div>`;
  // criterios con más desacuerdo
  const dis = [];
  for(const r of Object.values(agg)) if(r.n>=2) for(const ax of ["cc","cx"]) for(const c of CRIT[ax]) dis.push({id:r.id, ax, c, v:r.sdv[ax][c.id]});
  dis.sort((a,b)=>b.v-a.v);
  const w=520,h=230,pl=36,pr=12,pt=12,pb=30, maxD=Math.max(12,...rs.map(r=>r.disp))*1.15;
  const X=v=>pl+(v-20)/80*(w-pl-pr), Y=v=>pt+(1-v/maxD)*(h-pt-pb), T=7;
  return `<div class="lensnote">Cada punto es un esquema: hacia la derecha, mejor puntaje; hacia arriba, más diferencia entre evaluadores (desviación del puntaje combinado, en puntos).</div>
    <svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto">
      <rect x="${X(60)}" y="${Y(T)}" width="${X(100)-X(60)}" height="${Y(0)-Y(T)}" fill="var(--green-l)"/>
      <rect x="${X(60)}" y="${pt}" width="${X(100)-X(60)}" height="${Y(T)-pt}" fill="var(--amber-l)"/>
      <line x1="${X(60)}" x2="${X(60)}" y1="${pt}" y2="${h-pb}" stroke="#C9CDDD" stroke-dasharray="3 3"/>
      <line x1="${pl}" x2="${w-pr}" y1="${Y(T)}" y2="${Y(T)}" stroke="#C9CDDD" stroke-dasharray="3 3"/>
      <text x="${X(100)-6}" y="${Y(0)-6}" text-anchor="end" font-size="10.5" font-weight="600" fill="var(--green)">Listos para explorar</text>
      <text x="${X(100)-6}" y="${pt+13}" text-anchor="end" font-size="10.5" font-weight="600" fill="var(--amber-d)">Discutir en la sesión</text>
      <text x="${pl+6}" y="${pt+13}" font-size="10.5" font-weight="600" fill="var(--mute)">Revisar supuestos</text>
      ${[20,40,60,80,100].map(v=>`<text x="${X(v)}" y="${h-pb+14}" font-size="10" text-anchor="middle" fill="var(--mute)">${v}</text>`).join("")}
      <text x="${(pl+w)/2}" y="${h-4}" font-size="10.5" text-anchor="middle" fill="var(--ink2)">Puntaje combinado</text>
      ${rs.map(r=>`<g data-dsel="${r.id}" style="cursor:pointer"><circle cx="${X(r.comb)}" cy="${Y(r.disp)}" r="11" fill="${SCH[r.id].tipo==="actual"?"#8A8FA8":"var(--amber)"}" stroke="${r.id===S.dashSel?"var(--blue)":"#fff"}" stroke-width="2.5"/><text x="${X(r.comb)}" y="${Y(r.disp)+4}" text-anchor="middle" font-size="10" font-weight="700" fill="${SCH[r.id].tipo==="actual"?"#fff":"var(--ink)"}">${r.id}</text></g>`).join("")}
    </svg>
    <div><div class="seclbl" style="margin-bottom:6px">Dónde calibrar en la sesión: criterios con más desacuerdo</div>
      <div class="insights">${dis.slice(0,4).filter(d=>d.v>0).map(d=>`<div class="ins"><span class="k" style="background:${d.ax==="cc"?"var(--amber)":"var(--blue)"}">${d.ax==="cc"?"X":"Y"}</span><span><b>${esc(SCH[d.id].name)}</b>, ${d.c.label}: las calificaciones van de ${Math.min(...agg[d.id].raw[d.ax][d.c.id])} a ${Math.max(...agg[d.id].raw[d.ax][d.c.id])}</span></div>`).join("")||`<div class="ins">Los evaluadores coinciden en todos los criterios.</div>`}</div></div>`;
}
function lensSens(agg, rk, rob){

function lensPlaza(agg){
  return `<div class="lensnote">La filial no desaparece: cambia de rol según el tipo de plaza. Dentro de cada plaza, los esquemas se ordenan por su puntaje combinado actual.</div>
