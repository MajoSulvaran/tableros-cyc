<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agenda de líderes · NUBE</title>
<script src="../comun/tableros.js"></script>
<script src="../comun/puente.js" data-app="seg-agenda"></script>
</head>
<body style="font-family:Outfit,'Segoe UI',sans-serif;color:#565b85;padding:48px;text-align:center">
<p>Cargando Agenda de líderes…</p>
<script>
/* El reporte (con sus datos) vive en el repositorio privado: reporte-soluciones/reporte.html.
   Esta página solo lo trae con la sesión de NUBE y lo muestra. */
(async function () {
  try {
    const html = await PUENTE.G.texto(TABLEROS.CFG.REPO_DATOS, 'seguridad/agenda.html');
    if (!html) { document.body.innerHTML = '<h2 style="color:#1414B8;margin-top:12vh">Agenda de líderes</h2><p>Este apartado está en construcción. Cuando esté listo, se sube desde NUBE con <b>⇪ Nueva versión</b> en el menú.</p>'; return; }
    document.open(); document.write(html); document.close();
    PUENTE.despues();
  } catch (e) { document.body.innerHTML = '<h2 style="color:#0003aa">No se pudo cargar el reporte</h2><p>' + String(e.message).replace(/</g, '&lt;') + '</p>'; }
})();
</script>
</body>
</html>
